  <script>
    (function() {
      // 1. Cho phép Admin tắt chế độ bảo vệ khi debug: thêm ?admin_debug=ANHTUAN_ADMIN_2026 vào URL
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin_debug') === 'ANHTUAN_ADMIN_2026') {
        localStorage.setItem('at_admin_debug', 'true');
      }
      if (localStorage.getItem('at_admin_debug') === 'true') {
        return; // Admin mode: Bỏ qua mọi giới hạn
      }

      // Nhận diện thiết bị di động / cảm ứng để miễn trừ 100% false-positive
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
        || ('ontouchstart' in window) 
        || (navigator.maxTouchPoints > 0);

      let devtoolsDetected = false;
      let overlayEl = null;

      function createSecurityOverlay() {
        if (isMobile) return;
        if (overlayEl || !document.body) return;
        overlayEl = document.createElement('div');
        overlayEl.id = 'at-security-shield';
        overlayEl.style.cssText = 'position:fixed;inset:0;z-index:999999999;background:rgba(3,5,9,0.98);backdrop-filter:blur(32px);display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;font-family:sans-serif;text-align:center;';
        overlayEl.innerHTML = `
          <div style="max-width:460px;background:rgba(15,23,42,0.96);border:1px solid rgba(244,63,94,0.45);border-radius:24px;padding:32px 24px;box-shadow:0 25px 50px -12px rgba(244,63,94,0.4);">
            <div style="width:72px;height:72px;border-radius:50%;background:rgba(244,63,94,0.15);color:#f43f5e;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;border:1px solid rgba(244,63,94,0.3);">
              🛡️
            </div>
            <h3 style="font-size:18px;font-weight:900;color:#fff;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">CẢNH BÁO BẢO MẬT HỆ THỐNG</h3>
            <p style="font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:16px;">
              Hệ thống phát hiện bạn đang cố gắng truy cập mã nguồn qua <b style="color:#f43f5e;">Developer Tools (F12 / Elements)</b>. Toàn bộ nội dung và link cấu hình đã được khóa bảo vệ lập tức.
            </p>
            <div style="background:rgba(244,63,94,0.1);border:1px dashed rgba(244,63,94,0.3);border-radius:14px;padding:12px;font-size:11px;color:#fecdd3;margin-bottom:20px;font-weight:bold;">
              👉 Vui lòng ĐÓNG Developer Tools (F12) và bấm nút bên dưới để tiếp tục sử dụng!
            </div>
            <button onclick="window.location.reload()" style="width:100%;padding:12px 20px;border-radius:12px;background:linear-gradient(135deg,#f43f5e,#ec4899);color:#fff;font-weight:800;font-size:13px;border:none;cursor:pointer;box-shadow:0 10px 15px -3px rgba(244,63,94,0.3);">
              🔄 Tải Lại Trang
            </button>
          </div>
        `;
        document.body.appendChild(overlayEl);
      }

      function triggerSecurityAlert() {
        if (isMobile) return;
        if (localStorage.getItem('at_admin_debug') === 'true') return;
        if (!devtoolsDetected) {
          devtoolsDetected = true;
          // Giấu sạch cây DOM khỏi tab Elements
          const rootEl = document.getElementById('root');
          if (rootEl) {
            rootEl.style.display = 'none';
          }
          createSecurityOverlay();
          try {
            console.clear();
          } catch (_) {}
        }
      }

      // 1. Chặn phím tắt mở DevTools, View Source, Lưu trang trên máy tính
      window.addEventListener('keydown', function(e) {
        if (isMobile) return; // Miễn trừ điện thoại hoàn toàn

        // F12
        if (e.keyCode === 123 || e.key === 'F12') {
          e.preventDefault();
          e.stopPropagation();
          triggerSecurityAlert();
          return false;
        }
        // Ctrl + Shift + I / J / C (Windows)
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.key === 'I' || e.key === 'J' || e.key === 'C')) {
          e.preventDefault();
          e.stopPropagation();
          triggerSecurityAlert();
          return false;
        }
        // Cmd + Option + I / J / C (Mac)
        if (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.key === 'I' || e.key === 'J' || e.key === 'C')) {
          e.preventDefault();
          e.stopPropagation();
          triggerSecurityAlert();
          return false;
        }
        // Ctrl + U / Cmd + U (View Source)
        if ((e.ctrlKey || e.metaKey) && (e.keyCode === 85 || e.keyCode === 117 || e.key === 'u' || e.key === 'U')) {
          e.preventDefault();
          e.stopPropagation();
          triggerSecurityAlert();
          return false;
        }
        // Ctrl + S / Cmd + S (Save Page)
        if ((e.ctrlKey || e.metaKey) && (e.keyCode === 83 || e.keyCode === 115 || e.key === 's' || e.key === 'S')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, true);

      // 2. Chặn chuột phải (Context Menu) - Cho phép tự do trên ô input/textarea và mã key
      window.addEventListener('contextmenu', function(e) {
        const target = e.target;
        const tag = (target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'code' || target.closest('code') || target.closest('.select-all')) {
          return true; // Khách thoải mái paste key & sđt, copy mã key
        }
        if (!isMobile) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, true);

      // 3. Chặn kéo thả hình ảnh / text ra desktop (trừ ô nhập)
      window.addEventListener('dragstart', function(e) {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag !== 'input' && tag !== 'textarea') {
          e.preventDefault();
        }
      }, true);

      // 4. Vô hiệu hóa console methods trong production
      try {
        ['log', 'warn', 'info', 'table'].forEach(method => {
          const original = console[method];
          console[method] = function() {
            if (localStorage.getItem('at_admin_debug') === 'true') {
              original.apply(console, arguments);
            }
          };
        });
      } catch (_) {}

    })();
  </script>

                        <i className="fa-solid fa-spinner fa-spin"></i>

                      </>
                    ) : (
                      <>
                        <i className="fa-solid fa-search"></i>
                        <span>Tra Cứu</span>
                      </>
                    )}
                  </button>
                </div>

                {/* Lookup Results */}
                {orderLookupSearched && (
                  <div className="space-y-3 max-h-96 overflow-y-auto pr-1">
                    {(!orderLookupResult || orderLookupResult.length === 0) ? (
                      <div className="p-6 rounded-2xl bg-slate-900/50 text-center text-slate-400 text-xs">
                        <i className="fa-solid fa-box-open text-2xl mb-2 text-slate-600 block"></i>
                        Không tìm thấy đơn hàng nào với từ khóa: <b>{orderLookupQuery}</b>.<br />
                        <span className="text-[11px] text-slate-500 mt-1 block">💡 Mẹo: Bạn có thể nhập mã số (VD: <b>771492</b>) hoặc số điện thoại đặt hàng.</span>
                      </div>
                    ) : (
                      orderLookupResult.map(ord => (
                        <div key={ord.id} className="p-4 rounded-2xl bg-slate-900 border border-white/10 space-y-2.5">
                          <div className="flex items-center justify-between">
                            <span className="font-mono font-bold text-xs text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/20">
                              #{ord.id}
                            </span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              ord.status === 'approved' 
                                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' 
                                : ord.status === 'rejected'
                                  ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                                  : 'bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse'
                            }`}>
                              {ord.status === 'approved' ? '✅ ĐÃ DUYỆT & CẤP KEY' : ord.status === 'rejected' ? '❌ ĐÃ TỪ CHỐI' : '⏳ ĐANG CHỜ ADMIN DUYỆT'}
                            </span>
                          </div>

                          <div className="text-xs text-slate-300 space-y-1">
                            <p><b>Gói dịch vụ:</b> {ord.pkgName}</p>
                            <p><b>Số tiền:</b> <span className="font-mono text-emerald-400 font-bold">{ord.priceStr}</span></p>
                            <p><b>Khách hàng:</b> {ord.name} ({ord.contact})</p>
                            {ord.time && <p className="text-[11px] text-slate-500"><b>Thời gian đặt:</b> {ord.time}</p>}
                          </div>

                          {/* If Approved, show granted Key */}
                          {ord.status === 'approved' && (
                            <div className="p-3.5 rounded-2xl bg-gradient-to-r from-emerald-950/50 to-slate-950 border border-emerald-500/40 space-y-2.5 mt-2 shadow-lg">
                              <div className="flex items-center justify-between">
                                <span className="text-[10px] uppercase font-black text-emerald-400 flex items-center gap-1.5 tracking-wider">
                                  <i className="fa-solid fa-key text-amber-400 animate-pulse"></i> ACCESS KEY VIP CỦA BẠN:
                                </span>
                                <span className="text-[9px] text-emerald-300 font-bold bg-emerald-500/20 px-2 py-0.5 rounded-full border border-emerald-500/30">
                                  Sẵn Sàng Sử Dụng
                                </span>
                              </div>

                              {ord.grantedKey ? (
                                <div className="space-y-2">
                                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2 bg-slate-950 p-2.5 rounded-xl border border-white/10">
                                    <code className="font-mono font-black text-xs text-amber-300 px-2 py-1 select-all break-all text-center sm:text-left">
                                      {ord.grantedKey}
                                    </code>
                                    <div className="flex items-center gap-1.5 justify-center">
                                      <button
                                        onClick={() => {
                                          navigator.clipboard.writeText(ord.grantedKey);
                                          showToast('Đã sao chép mã Key VIP: ' + ord.grantedKey, 'fa-check');
                                        }}
                                        className="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs transition flex items-center gap-1 shadow"
                                      >
                                        <i className="fa-solid fa-copy"></i> Copy Key
                                      </button>
                                      <button
                                        onClick={() => {
                                          setShowOrderLookupModal(false);
                                          handleCheckAccessKey(ord.grantedKey);
                                        }}
                                        className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs transition flex items-center gap-1 shadow"
                                        title="Kích hoạt luôn quyền VIP trên website"
                                      >
                                        <i className="fa-solid fa-bolt"></i> Kích Hoạt Luôn
                                      </button>
                                    </div>
                                  </div>
                                  <p className="text-[10px] text-slate-400 italic">
                                    💡 <b>Hướng dẫn:</b> Bạn hãy copy mã Key trên để kích hoạt trên web, hoặc mở app Shadowrocket / Locket và điền vào theo hướng dẫn.
                                  </p>
                                </div>
                              ) : (
                                <div className="text-[11px] text-slate-300 space-y-1">
                                  <p>Đơn hàng đã được duyệt! Đang liên kết mã Key. Nếu chưa thấy hiện mã, vui lòng liên hệ Admin qua Zalo để nhận mã ngay.</p>
                                  <a
                                    href={CONFIGS.adminZalo}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center gap-1 text-xs text-sky-400 underline font-bold mt-1"
                                  >
                                    <i className="fa-solid fa-comment-dots"></i> Nhắn Zalo cho Admin nhận Key
                                  </a>
                                </div>
                              )}
                            </div>
                          )}

                          {ord.status === 'pending' && (
                            <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-200 text-xs space-y-1">
                              <p className="font-semibold flex items-center gap-1.5">
                                <i className="fa-solid fa-clock text-amber-400"></i> Đang chờ Admin xác nhận biên lai chuyển khoản
                              </p>
                              <p className="text-[10px] text-slate-400">
                                Sau khi Admin duyệt đơn, Access Key VIP sẽ tự động hiển thị ngay tại bảng này! Bạn có thể tra cứu lại bất cứ lúc nào.
                              </p>
                            </div>
                          )}

                          {ord.status === 'rejected' && (
                            <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs space-y-1">
                              <p className="font-semibold flex items-center gap-1.5">
                                <i className="fa-solid fa-triangle-exclamation text-rose-400"></i> Đơn hàng chưa thể duyệt do sai nội dung CK hoặc ảnh bill không khớp
                              </p>
                              <a
                                href={CONFIGS.adminZalo}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center gap-1 text-[11px] text-sky-400 underline font-bold"
                              >
                                Nhắn tin cho Admin để được hỗ trợ kiểm tra lại
                              </a>
                            </div>
                          )}
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: VÒNG QUAY MAY MẮN (LUCKY WHEEL) */}
          {/* ======================================================== */}
          {showLuckyWheelModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card max-w-sm w-full rounded-3xl p-6 border border-purple-500/40 shadow-2xl relative text-center space-y-4">
                <button 
                  onClick={() => setShowLuckyWheelModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-slate-400 hover:text-white transition"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div>
                  <span className="px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 font-black text-[10px] uppercase border border-purple-500/30">
                    QUAY LÀ TRÚNG 100%
                  </span>
                  <h3 className="font-black text-xl text-white mt-1">🎁 VÒNG QUAY MAY MẮN</h3>
                  <p className="text-[11px] text-slate-400">Trúng ngay voucher giảm tới 50k hoặc Key VIP trải nghiệm 2 giờ!</p>
                </div>

                {/* Canvas Wheel Simulation */}
                <div className="relative w-64 h-64 mx-auto my-2 flex items-center justify-center">
                  {/* Wheel Pointer Arrow */}
                  <div className="absolute -top-2 left-1/2 -translate-x-1/2 z-20 text-amber-400 text-2xl drop-shadow-md">
                    <i className="fa-solid fa-caret-down"></i>
                  </div>

                  <div 
                    className="w-60 h-60 rounded-full border-4 border-amber-400 shadow-2xl relative overflow-hidden transition-all duration-[5000ms] ease-out flex items-center justify-center"
                    style={{ 
                      transform: `rotate(${wheelAngle}deg)`,
                      background: 'conic-gradient(#f59e0b 0deg 60deg, #8b5cf6 60deg 120deg, #ec4899 120deg 180deg, #3b82f6 180deg 240deg, #10b981 240deg 300deg, #06b6d4 300deg 360deg)'
                    }}
                  >
                    <div className="absolute w-14 h-14 rounded-full bg-slate-950 border-4 border-amber-400 flex items-center justify-center text-amber-400 font-black text-xs z-10 shadow-lg">
                      LUCK
                    </div>
                  </div>
                </div>

                {/* Prize Result Box */}
                {wheelPrize && (
                  <div className="p-4 rounded-2xl bg-gradient-to-r from-purple-500/20 to-pink-500/20 border border-purple-500/40 animate-bounce space-y-1">
                    <span className="text-[10px] uppercase font-bold text-amber-300">🎉 CHÚC MỪNG BẠN TRÚNG:</span>
                    <h4 className="text-base font-black text-white">{wheelPrize.label}</h4>
                    {wheelPrize.type === 'trial_key' && wheelPrize.trialKey && (
                      <div className="mt-2 text-xs">
                        <p className="text-slate-300">Mã Key Dùng Thử 2 Giờ:</p>
                        <code className="font-mono font-bold text-amber-300 bg-black/50 px-2 py-1 rounded block my-1">
                          {wheelPrize.trialKey}
                        </code>
                        <button
                          onClick={() => {
                            setShowLuckyWheelModal(false);
                            handleCheckAccessKey(wheelPrize.trialKey);
                          }}
                          className="mt-1 px-3 py-1 rounded-lg bg-emerald-500 text-white font-bold text-xs"
                        >
                          ⚡ Kích Hoạt Dùng Thử Ngay
                        </button>
                      </div>
                    )}
                  </div>
                )}

                <button
                  onClick={handleSpinWheel}
                  disabled={wheelSpinning}
                  className={`w-full py-3.5 rounded-2xl font-black text-xs uppercase tracking-wider transition shadow-xl ${
                    wheelSpinning 
                      ? 'bg-slate-700 text-slate-400 cursor-not-allowed' 
                      : 'bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 hover:opacity-95 text-white shadow-pink-500/30'
                  }`}
                >
                  {wheelSpinning ? 'Đang quay...' : 'QUAY NGAY (1 LƯỢT MIỄN PHÍ)'}
                </button>
              </div>
            </div>
          )}
          {/* Back To Top Button */}
          {showBackTop && (
            <button 
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              aria-label="Lên đầu trang"
              className="fixed bottom-20 md:bottom-6 right-5 z-40 w-11 h-11 rounded-full glass-card border border-sky-400/40 text-sky-400 flex items-center justify-center shadow-xl hover:scale-110 transition"
            >
              <i className="fa-solid fa-arrow-up text-sm"></i>
            </button>
          )}

          {/* ======================================================== */}
          {/* MOBILE BOTTOM NAVIGATION BAR (iOS STYLE) */}
          {/* ======================================================== */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 backdrop-blur-2xl bg-slate-950/80 border-t border-white/10 px-2 py-2 flex items-center justify-around">
            <a href="#packages-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-sky-400 py-1 px-3">
              <i className="fa-solid fa-crown text-amber-400 text-sm"></i>
              <span>Gói VIP</span>
            </a>
            <a href="#caption-studio" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-pink-400 py-1 px-3">
              <i className="fa-solid fa-wand-magic-sparkles text-pink-400 text-sm"></i>
              <span>Caption</span>
            </a>
            <a href="#qr-payment-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-emerald-400 py-1 px-3">
              <i className="fa-solid fa-qrcode text-emerald-400 text-sm"></i>
              <span>Mua QR</span>
            </a>
            <a href="#config-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-sky-400 py-1 px-3">
              <i className="fa-solid fa-cloud-arrow-down text-sky-400 text-sm"></i>
              <span>Config Free</span>
            </a>
            <a href="#faq-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-purple-400 py-1 px-3">
              <i className="fa-solid fa-circle-question text-purple-400 text-sm"></i>
              <span>Hỏi Đáp</span>
            </a>
          </nav>

          {/* Footer */}
          <footer className="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400 border-t border-white/10 pt-8 mt-12">
            <p className="font-bold text-slate-300 mb-1">© 2026 Anh Tuấn iOS • Locket 60s & ShadowRocket Premium</p>
            <p className="text-[11px] text-slate-400 mb-3">Thiết kế chuẩn React UI hiện đại • Chúc bạn có trải nghiệm tuyệt vời cùng Locket Gold!</p>
            <div className="flex items-center justify-center gap-2">
              <a 
                href="./admin" 
                className="px-3 py-1 rounded-full bg-white/5 hover:bg-emerald-500/20 text-slate-400 hover:text-emerald-400 border border-white/10 text-[11px] font-mono font-bold transition flex items-center gap-1.5"
              >
                <i className="fa-solid fa-lock text-[10px]"></i> Bảng Quản Trị Admin
              </a>
            </div>
          </footer>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Tự động xóa sạch thẻ script mã nguồn khỏi DOM sau 250ms để tab Elements hoàn toàn trống trơn
    setTimeout(function cleanDomScripts() {
      try {
        const scripts = document.querySelectorAll('script[type="text/babel"]');
        scripts.forEach(function(s) {
          s.textContent = '';
          s.remove();
        });
      } catch (_) {}
    }, 250);
  </script>
</body>
</html>
