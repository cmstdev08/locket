            {/* SECTION: LIÊN HỆ HỖ TRỢ & GỬI THƯ TÁC GIẢ */}
            {/* ======================================================== */}
            <section className="mb-10">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                
                {/* Support Form */}
                <div className="glass-card rounded-3xl p-6 border border-white/10">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center">
                      <i className="fa-solid fa-headset text-base"></i>
                    </div>
                    <div>
                      <h4 className="font-extrabold text-base text-white">Yêu Cầu Hỗ Trợ Kỹ Thuật</h4>
                      <p className="text-xs text-slate-400">Gặp khó khăn khi cài đặt? Gửi tin nhắn ngay</p>
                    </div>
                  </div>

                  {contactSuccess ? (
                    <div className="p-6 text-center space-y-3">
                      <div className="w-14 h-14 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center text-2xl">
                        <i className="fa-solid fa-check"></i>
                      </div>
                      <h5 className="font-black text-white text-base">Đã Gửi Thành Công!</h5>
                      <p className="text-xs text-slate-300">Cảm ơn bạn. Anh Tuấn sẽ phản hồi lại bạn sớm nhất có thể.</p>
                      <button 
                        onClick={() => setContactSuccess(false)}
                        className="px-4 py-2 rounded-xl bg-white/10 text-xs font-bold text-white hover:bg-white/15"
                      >
                        Gửi Yêu Cầu Khác
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleSubmitSupport} className="space-y-3">
                      <input 
                        type="text" 
                        required
                        value={contactForm.name}
                        onChange={e => setContactForm(p => ({ ...p, name: e.target.value }))}
                        placeholder="Tên của bạn"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-400"
                      />
                      <input 
                        type="text" 
                        required
                        value={contactForm.contact}
                        onChange={e => setContactForm(p => ({ ...p, contact: e.target.value }))}
                        placeholder="Số Zalo hoặc Telegram"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-400"
                      />
                      <select 
                        value={contactForm.subject}
                        onChange={e => setContactForm(p => ({ ...p, subject: e.target.value }))}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-400 cursor-pointer"
                      >
                        <option value="Hỗ trợ Locket 60s">Hỗ trợ cài đặt Locket 60s VIP</option>
                        <option value="Lỗi Locket Gold">Báo lỗi Locket Gold</option>
                        <option value="Hỗ trợ Youtube / Spotify">Hỗ trợ Youtube / Spotify</option>
                        <option value="Yêu cầu khác">Khác</option>
                      </select>
                      <textarea 
                        rows="3"
                        required
                        value={contactForm.message}
                        onChange={e => setContactForm(p => ({ ...p, message: e.target.value }))}
                        placeholder="Mô tả sự cố bạn đang gặp phải..."
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs focus:outline-none focus:border-sky-400"
                      ></textarea>
                      <button
                        type="submit"
                        disabled={contactSubmitting}
                        className="keep-white w-full py-3 rounded-xl bg-sky-500 hover:bg-sky-400 font-extrabold text-xs uppercase tracking-wider transition"
                      >
                        {contactSubmitting ? 'ĐANG GỬI...' : 'GỬI YÊU CẦU HỖ TRỢ'}
                      </button>
                    </form>
                  )}
                </div>

                {/* About Author Card */}
                <div className="glass-card rounded-3xl p-6 border border-white/10 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center gap-3.5 mb-4">
                      <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-400 via-indigo-500 to-pink-500 p-0.5 shadow-lg flex-shrink-0">
                        <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center font-display font-black text-xl text-sky-400">
                          AT
                        </div>
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="font-black text-lg text-white">ANH TUẤN</h4>
                          <i className="fa-solid fa-circle-check text-sky-400 text-sm"></i>
                        </div>
                        <p className="text-[11px] font-bold text-pink-400 uppercase tracking-wider">iOS Config Developer & Creator</p>
                      </div>
                    </div>

                    <p className="text-xs text-slate-300 leading-relaxed mb-4">
                      Chuyên phát triển và nghiên cứu các module ShadowRocket, giải pháp DNS duy trì chứng chỉ không giới hạn cho cộng đồng iOS Việt Nam. Cam kết hỗ trợ nhiệt tình, bảo hành uy tín 100%!
                    </p>

                    <div className="flex flex-wrap gap-1.5 mb-5">
                      <span className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20">ShadowRocket Pro</span>
                      <span className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-pink-500/10 text-pink-400 border border-pink-500/20">Locket 60s VIP</span>
                      <span className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">DNS MobileConfig</span>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-2 border-t border-white/10">
                    <a 
                      href={CONFIGS.adminTelegram} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="flex-1 py-2.5 rounded-xl bg-white/5 hover:bg-sky-500/20 text-slate-300 hover:text-sky-400 text-xs font-bold text-center border border-white/10 transition flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-brands fa-telegram text-sm"></i> Telegram
                    </a>
                    <a 
                      href={CONFIGS.adminInstagram} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="flex-1 py-2.5 rounded-xl bg-white/5 hover:bg-pink-500/20 text-slate-300 hover:text-pink-400 text-xs font-bold text-center border border-white/10 transition flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-brands fa-instagram text-sm"></i> Instagram
                    </a>
                    <a 
                      href={CONFIGS.adminZalo} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="flex-1 py-2.5 rounded-xl bg-white/5 hover:bg-blue-500/20 text-slate-300 hover:text-blue-400 text-xs font-bold text-center border border-white/10 transition flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-solid fa-comment-dots text-sm"></i> Zalo
                    </a>
                  </div>
                </div>

              </div>
            </section>
          </main>

          {/* ======================================================== */}
          {/* MODAL: QR CODE FOR SHADOWROCKET CONFIG */}
          {/* ======================================================== */}
          {qrConfigModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" onClick={() => setQrConfigModal(null)}>
              <div className="glass-card max-w-xs w-full rounded-3xl p-6 text-center border border-sky-500/40 shadow-2xl" onClick={e => e.stopPropagation()}>
                <h4 className="font-extrabold text-base text-white mb-1">{qrConfigModal.title}</h4>
                <p className="text-[11px] text-slate-400 mb-4">Mở Camera iPhone hoặc tính năng Quét QR trong ShadowRocket để cài đặt</p>
                <div className="bg-white p-4 rounded-2xl inline-block mb-4 shadow-lg">
                  <img 
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(qrConfigModal.url)}`} 
                    alt="Config QR" 
                    className="w-48 h-48 object-contain"
                  />
                </div>
                <button 
                  onClick={() => setQrConfigModal(null)}
                  className="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white font-bold text-xs transition"
                >
                  Đóng
                </button>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: ORDER SUCCESS */}
          {/* ======================================================== */}
          {orderSuccessModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 text-center border border-emerald-500/40 relative shadow-2xl">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center text-3xl mb-4 border border-emerald-500/30">
                  <i className="fa-solid fa-check"></i>
                </div>
                <h3 className="text-xl font-black font-display text-white mb-2">ĐẶT HÀNG THÀNH CÔNG! 🎉</h3>
                <p className="text-xs text-slate-300 leading-relaxed mb-4">
                  Cảm ơn bạn <b className="text-white">{orderForm.name}</b> đã ủng hộ Anh Tuấn iOS. Mã đơn của bạn là:
                </p>

                <div className="p-3 rounded-2xl bg-slate-900 border border-emerald-500/30 text-center mb-5">
                  <span className="text-[10px] text-slate-400 uppercase tracking-widest block">Mã Đơn Hàng</span>
                  <span className="font-mono font-extrabold text-emerald-400 text-lg tracking-wider">{lastOrderCode}</span>
                </div>

                <p className="text-[11px] text-slate-300 mb-6 leading-relaxed">
                  Thông tin và ảnh biên lai đã được gửi tới Telegram của Anh Tuấn. Để nhận file cấu hình ngay lập tức, bạn hãy bấm nhắn tin bên dưới nhé!
                </p>

                <div className="space-y-2.5">
                  <a 
                    href={`${CONFIGS.adminTelegram}?text=${encodeURIComponent(`Chào Anh Tuấn, mình vừa đặt đơn hàng mã ${lastOrderCode} (${selectedPackage.name} - ${formatCurrency(finalPriceNum)}). Nhờ bạn gửi file và kích hoạt giúp mình nhé!`)}`}
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="keep-white w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-400 to-blue-600 font-extrabold text-xs flex items-center justify-center gap-2 shadow-lg hover:scale-105 transition"
                  >
                    <i className="fa-brands fa-telegram text-base"></i> Nhắn Tin Qua Telegram Ngay
                  </a>

                  <a 
                    href={CONFIGS.adminZalo}
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="keep-white w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 font-extrabold text-xs flex items-center justify-center gap-2 shadow-lg hover:scale-105 transition"
                  >
                    <i className="fa-solid fa-comment text-base"></i> Nhắn Tin Qua Zalo
                  </a>

                  <button 
                    onClick={() => setOrderSuccessModal(false)}
                    className="w-full py-3 rounded-xl bg-white/10 hover:bg-white/15 text-slate-300 font-bold text-xs transition"
                  >
                    Đóng cửa sổ này
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Back To Top Button */}
          {showBackTop && (
            <button 
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              aria-label="Lên đầu trang"
              className="fixed bottom-20 md:bottom-6 right-5 z-40 w-11 h-11 rounded-full glass-card border border-sky-400/40 text-sky-400 flex items-center justify-center shadow-xl hover:scale-110 transition"
            >
              <i className="fa-solid fa-arrow-up text-sm"></i>
            </button>
          )}

          {/* ======================================================== */}
          {/* MOBILE BOTTOM NAVIGATION BAR (iOS STYLE) */}
          {/* ======================================================== */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 backdrop-blur-2xl bg-slate-950/80 border-t border-white/10 px-2 py-2 flex items-center justify-around">
            <a href="#packages-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-sky-400 py-1 px-3">
              <i className="fa-solid fa-crown text-amber-400 text-sm"></i>
              <span>Gói VIP</span>
            </a>
            <a href="#caption-studio" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-pink-400 py-1 px-3">
              <i className="fa-solid fa-wand-magic-sparkles text-pink-400 text-sm"></i>
              <span>Caption</span>
            </a>
            <a href="#qr-payment-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-emerald-400 py-1 px-3">
              <i className="fa-solid fa-qrcode text-emerald-400 text-sm"></i>
              <span>Mua QR</span>
            </a>
            <a href="#config-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-sky-400 py-1 px-3">
              <i className="fa-solid fa-cloud-arrow-down text-sky-400 text-sm"></i>
              <span>Config Free</span>
            </a>
            <a href="#faq-section" className="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-300 hover:text-purple-400 py-1 px-3">
              <i className="fa-solid fa-circle-question text-purple-400 text-sm"></i>
              <span>Hỏi Đáp</span>
            </a>
          </nav>

          {/* Footer */}
          <footer className="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400 border-t border-white/10 pt-8 mt-12">
            <p className="font-bold text-slate-300 mb-1">© 2026 Anh Tuấn iOS • Locket 60s & ShadowRocket Premium</p>
            <p className="text-[11px] text-slate-400">Thiết kế chuẩn React UI hiện đại • Chúc bạn có trải nghiệm tuyệt vời cùng Locket Gold!</p>
          </footer>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
