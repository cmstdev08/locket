<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030509">
  <title>Anh Tuấn iOS | Bảng Điều Khiển Quản Trị Hệ Thống (Admin Portal)</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Fonts & Icons -->
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#38bdf8',
              indigo: '#818cf8',
              purple: '#a855f7',
              pink: '#ec4899',
              gold: '#fbbf24',
              green: '#22c55e',
              dark: '#030509',
              card: 'rgba(15, 23, 42, 0.75)'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel CDN (Cloudflare CDN Edge) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.0/babel.min.js"></script>

  <style>
    :root {
      --bg-main: #030509;
      --text-main: #f8fafc;
      --glass-bg: rgba(15, 23, 42, 0.72);
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
    }
    .glass-card-hover {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card-hover:hover {
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.2);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.5); }
  </style>
</head>
<body class="bg-[#030509] text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- React Root Container -->
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#030509;color:#fff;font-family:sans-serif;">
      <div style="width:50px;height:50px;border:3px solid rgba(16,185,129,0.2);border-top-color:#10b981;border-radius:50%;animation:atSpin 0.75s linear infinite;"></div>
      <p style="margin-top:16px;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#94a3b8;">Đang nạp Bảng Quản Trị...</p>
    </div>
    <style>@keyframes atSpin{to{transform:rotate(360deg)}}</style>
  </div>

  <!-- React Babel Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_CONFIG = {
      adminCredentials: { username: "anhtuaan08", password: "admin2026@anhtuan" },
      bankConfig: {
        bankNumber: "7898376962",
        bankName: "Vietcombank",
        bankOwner: "TRAN VAN ANH TUAN",
        momoNumber: "0898376962",
        paypalUrl: "https://paypal.me/anhtuaan"
      },
      contactConfig: {
        adminTelegram: "https://t.me/anhtuaan",
        adminInstagram: "https://www.instagram.com/anhtuaan.08",
        adminZalo: "https://zalo.me/0898376962",
        hotline: "0898.376.962"
      },
      telegramConfig: { telegramBotToken: "", telegramChatId: "" },
      githubConfig: { defaultGhRepo: "cmstdev08/locket", defaultGhBranch: "master", defaultGhToken: "" },
      popupConfig: {
        enabled: false,
        title: "🎉 THÔNG BÁO TỪ ANH TUẤN iOS",
        badge: "TIN NÓNG",
        content: "Gói Locket 60s VIP vĩnh viễn đang mở bán với giá ưu đãi! Chúc bạn có trải nghiệm tuyệt vời.",
        btnText: "Xem Ngay",
        btnLink: "#pricing"
      },
      packages: [],
      vouchers: []
    };

    function AdminApp() {
      // Auth State
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return sessionStorage.getItem('at_admin_auth') === 'true' || localStorage.getItem('at_admin_auth') === 'true';
      });
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [loginError, setLoginError] = useState('');

      // Active Tab State
      const [activeTab, setActiveTab] = useState('keys'); // 'keys', 'bank', 'packages', 'vouchers', 'popup', 'system'

      // Data State
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [keysData, setKeysData] = useState({ adminMasterKey: 'ANHTUAN_ADMIN_2026', keys: [] });
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [toast, setToast] = useState({ show: false, text: '', icon: 'fa-check' });

      // Key Management Filter & Modal State
      const [keySearch, setKeySearch] = useState('');
      const [editingKey, setEditingKey] = useState(null); // null or key object
      const [showKeyModal, setShowKeyModal] = useState(false);

      // Voucher Management Modal State
      const [showVoucherModal, setShowVoucherModal] = useState(false);
      const [editingVoucher, setEditingVoucher] = useState(null);
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [tokenModalInput, setTokenModalInput] = useState('');

      const showToast = (text, icon = 'fa-circle-check') => {
        setToast({ show: true, text, icon });
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3000);
      };

      // Load Config & Keys on mount
      useEffect(() => {
        const loadAllData = async () => {
          setLoading(true);
          try {
            // 1. Fetch site-config.json
            let loadedCfg = null;
            try {
              const resCfg = await fetch('./site-config.json?_t=' + Date.now());
              if (resCfg.ok) loadedCfg = await resCfg.json();
            } catch (_) {}
            if (!loadedCfg) {
              const savedLocal = localStorage.getItem('at_site_config');
              if (savedLocal) {
                try { loadedCfg = JSON.parse(savedLocal); } catch(_) {}
              }
            }
            if (loadedCfg) {
              // Gộp token từ localStorage nếu có
              const savedGhToken = localStorage.getItem('at_gh_token');
              const savedTeleToken = localStorage.getItem('at_tele_token');
              const savedTeleChat = localStorage.getItem('at_tele_chat_id');
              if (savedGhToken && !loadedCfg.githubConfig.defaultGhToken) {
                loadedCfg.githubConfig.defaultGhToken = savedGhToken;
              }
              if (savedTeleToken && !loadedCfg.telegramConfig.telegramBotToken) {
                loadedCfg.telegramConfig.telegramBotToken = savedTeleToken;
              }
              if (savedTeleChat && !loadedCfg.telegramConfig.telegramChatId) {
                loadedCfg.telegramConfig.telegramChatId = savedTeleChat;
              }
              setConfig(loadedCfg);
            }

            // 2. Fetch access-keys.json
            let loadedKeys = null;
            try {
              const resKeys = await fetch('./access-keys.json?_t=' + Date.now());
              if (resKeys.ok) loadedKeys = await resKeys.json();
            } catch (_) {}
            if (loadedKeys) {
              setKeysData(loadedKeys);
            }
          } catch (err) {
            console.error('Error loading data:', err);
          } finally {
            setLoading(false);
          }
        };

        loadAllData();
      }, []);

      // Handle Login
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const validUser = config?.adminCredentials?.username || 'anhtuaan08';
        const validPass = config?.adminCredentials?.password || 'admin2026@anhtuan';

        if (loginUser.trim() === validUser && loginPass === validPass) {
          setIsLoggedIn(true);
          if (rememberMe) localStorage.setItem('at_admin_auth', 'true');
          sessionStorage.setItem('at_admin_auth', 'true');
          showToast('Đăng nhập thành công! Chào mừng Boss Anh Tuấn.', 'fa-crown');
        } else {
          setLoginError('Tài khoản hoặc mật khẩu không chính xác!');
        }
      };

      // Handle Logout
      const handleLogout = () => {
        setIsLoggedIn(false);
        sessionStorage.removeItem('at_admin_auth');
        localStorage.removeItem('at_admin_auth');
        showToast('Đã đăng xuất khỏi trang quản trị!', 'fa-arrow-right-from-bracket');
      };

      // GitHub Commit Helper
      const commitFileToGitHub = async (token, repo, branch, path, contentStr, commitMsg) => {
        const cleanToken = (token || '').trim();
        const getUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`;
        let sha = undefined;
        try {
          const checkRes = await fetch(getUrl, {
            headers: {
              'Authorization': `Bearer ${cleanToken}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });
          if (checkRes.ok) {
            const checkData = await checkRes.json();
            sha = checkData.sha;
          } else if (checkRes.status === 401) {
            throw new Error('GitHub Token không hợp lệ hoặc đã hết hạn (401 Bad Credentials)!');
          } else if (checkRes.status === 404) {
            const repoRes = await fetch(`https://api.github.com/repos/${repo}`, {
              headers: { 'Authorization': `Bearer ${cleanToken}` }
            });
            if (!repoRes.ok) {
              throw new Error(`Không tìm thấy Repo "${repo}" hoặc Token không có quyền truy cập!`);
            }
          }
        } catch (eCheck) {
          if (eCheck.message && (eCheck.message.includes('Token') || eCheck.message.includes('Repo'))) {
            throw eCheck;
          }
        }

        const putUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
        const b64 = btoa(unescape(encodeURIComponent(contentStr)));
        const bodyPayload = {
          message: commitMsg,
          content: b64,
          branch: branch
        };
        if (sha) bodyPayload.sha = sha;

        const res = await fetch(putUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cleanToken}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(bodyPayload)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          if (res.status === 401) throw new Error('GitHub Token không có quyền đẩy mã (Cần tích chọn quyền repo)');
          if (res.status === 409) throw new Error('Xung đột commit trên GitHub! Vui lòng bấm lưu lại lần nữa');
          throw new Error(errData.message || `Lỗi HTTP ${res.status}`);
        }
        return true;
      };

      // Save & Sync All Changes directly to GitHub Cloud
      const handleSaveAndSyncGitHub = async () => {
        setSaving(true);
        const token = (config.githubConfig.defaultGhToken || localStorage.getItem('at_gh_token') || '').trim();
        const repo = (config.githubConfig.defaultGhRepo || 'cmstdev08/locket').trim();
        const branch = (config.githubConfig.defaultGhBranch || 'master').trim();

        // 1. Lưu tạm vào LocalStorage trước
        localStorage.setItem('at_site_config', JSON.stringify(config));
        if (token) localStorage.setItem('at_gh_token', token);
        if (config.telegramConfig.telegramBotToken) localStorage.setItem('at_tele_token', config.telegramConfig.telegramBotToken);
        if (config.telegramConfig.telegramChatId) localStorage.setItem('at_tele_chat_id', config.telegramConfig.telegramChatId);

        if (!token) {
          setSaving(false);
          setShowTokenModal(true);
          return;
        }

        try {
          // 2. Commit site-config.json
          await commitFileToGitHub(
            token, repo, branch,
            'site-config.json',
            JSON.stringify(config, null, 2),
            `⚙️ Admin Cập Nhật Cấu Hình Website: ${new Date().toLocaleString('vi-VN')}`
          );

          // 3. Commit access-keys.json
          await commitFileToGitHub(
            token, repo, branch,
            'access-keys.json',
            JSON.stringify(keysData, null, 2),
            `🔑 Admin Cập Nhật Danh Sách Access Keys: ${new Date().toLocaleString('vi-VN')}`
          );

          showToast('🎉 Tuyệt vời! Đã đồng bộ và lưu toàn bộ lên GitHub Cloud thành công!', 'fa-cloud-arrow-up');
        } catch (err) {
          console.error('Lỗi khi đẩy GitHub:', err);
          showToast(`Lỗi khi đẩy GitHub: ${err.message}. Đã lưu tạm trên máy.`, 'fa-triangle-exclamation');
        } finally {
          setSaving(false);
        }
      };

      // Key Helpers
      const filteredKeys = useMemo(() => {
        const q = keySearch.trim().toLowerCase();
        if (!q) return keysData.keys || [];
        return (keysData.keys || []).filter(k => 
          (k.key || '').toLowerCase().includes(q) ||
          (k.owner || '').toLowerCase().includes(q) ||
          (k.boundUsername || '').toLowerCase().includes(q)
        );
      }, [keysData.keys, keySearch]);

      const handleSaveKey = (e) => {
        e.preventDefault();
        const form = e.target;
        const keyVal = form.keyVal.value.trim();
        const ownerVal = form.ownerVal.value.trim() || 'Khách hàng';
        const boundUserVal = form.boundUserVal.value.trim().replace(/^@/, '').toLowerCase();
        const maxUsesVal = parseInt(form.maxUsesVal.value, 10) || 100;
        const expiresVal = form.expiresVal.value || '2099-12-31';
        const isMasterVal = form.isMasterVal.checked;

        if (!keyVal) {
          alert('Vui lòng nhập mã Key!');
          return;
        }

        const newKeyObj = {
          key: keyVal,
          owner: ownerVal,
          boundUsername: boundUserVal || undefined,
          allowedFeatures: ["all"],
          isMaster: isMasterVal ? true : undefined,
          maxUses: maxUsesVal,
          usedCount: editingKey ? (editingKey.usedCount || 0) : 0,
          expiresAt: expiresVal
        };

        const existingIdx = (keysData.keys || []).findIndex(k => k.key.toUpperCase() === keyVal.toUpperCase());
        let updatedList = [...(keysData.keys || [])];

        if (existingIdx !== -1) {
          updatedList[existingIdx] = { ...updatedList[existingIdx], ...newKeyObj };
        } else {
          updatedList.unshift(newKeyObj);
        }

        setKeysData({ ...keysData, keys: updatedList });
        setShowKeyModal(false);
        setEditingKey(null);
        showToast(`Đã lưu Key ${keyVal}! Hãy bấm nút "Lưu Lên GitHub" ở góc trên.`);
      };

      const handleDeleteKey = (targetKey) => {
        if (!confirm(`Bạn có chắc chắn muốn XÓA vĩnh viễn Key "${targetKey}" không?`)) return;
        const updatedList = (keysData.keys || []).filter(k => k.key !== targetKey);
        setKeysData({ ...keysData, keys: updatedList });
        showToast(`Đã xóa Key ${targetKey}! Hãy bấm "Lưu Lên GitHub" để hoàn tất.`);
      };

      const generateRandomKey = () => {
        const phone = '09' + Math.floor(10000000 + Math.random() * 90000000);
        return `Locket60s-${phone}`;
      };

      // Package Toggle Maintenance
      const handleTogglePackageMaintenance = (pkgId) => {
        const updatedPkgs = (config.packages || []).map(p => {
          if (p.id === pkgId) {
            const nextM = !p.isMaintenance;
            return {
              ...p,
              isMaintenance: nextM,
              tag: nextM ? 'BẢO TRÌ VÔ THỜI HẠN 🔒' : (p.id === 'locket-60s' ? 'ĐANG MỞ BÁN • VĨNH VIỄN TRỌN ĐỜI 🔥' : 'ĐANG MỞ BÁN 🔥')
            };
          }
          return p;
        });
        setConfig({ ...config, packages: updatedPkgs });
        showToast('Đã đổi trạng thái gói! Bấm "Lưu Lên GitHub" để cập nhật web khách.');
      };

      // Package Update Price
      const handleUpdatePackagePrice = (pkgId, newPriceNum, newPriceStr, newOriginalStr) => {
        const updatedPkgs = (config.packages || []).map(p => {
          if (p.id === pkgId) {
            return {
              ...p,
              priceNum: newPriceNum,
              price: newPriceStr,
              originalPrice: newOriginalStr
            };
          }
          return p;
        });
        setConfig({ ...config, packages: updatedPkgs });
        showToast('Đã cập nhật giá bán mới!');
      };

      // Voucher Helpers
      const handleSaveVoucher = (e) => {
        e.preventDefault();
        const code = e.target.vCode.value.trim().toUpperCase();
        const discount = parseInt(e.target.vDiscount.value, 10) || 0;
        const desc = e.target.vDesc.value.trim() || 'Mã ưu đãi giảm giá';
        if (!code) return;

        const newVoucher = { code, discount, desc };
        const list = [...(config.vouchers || [])];
        const idx = list.findIndex(v => v.code === code);
        if (idx !== -1) list[idx] = newVoucher;
        else list.push(newVoucher);

        setConfig({ ...config, vouchers: list });
        setShowVoucherModal(false);
        setEditingVoucher(null);
        showToast(`Đã lưu Voucher ${code}! Bấm "Lưu Lên GitHub" để áp dụng.`);
      };

      const handleDeleteVoucher = (code) => {
        if (!confirm(`Xóa mã voucher "${code}"?`)) return;
        const list = (config.vouchers || []).filter(v => v.code !== code);
        setConfig({ ...config, vouchers: list });
        showToast(`Đã xóa voucher ${code}!`);
      };

      // Test Telegram message
      const handleTestTelegram = async () => {
        const botToken = (config.telegramConfig.telegramBotToken || '').trim();
        const chatId = (config.telegramConfig.telegramChatId || '').trim();
        if (!botToken || !chatId) {
          alert('Vui lòng nhập đủ Bot Token và Chat ID trước khi test!');
          return;
        }
        try {
          const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: chatId,
              text: `👑 <b>ANH TUẤN iOS - TEST BOT THÀNH CÔNG!</b>\n━━━━━━━━━━━━━━━━━━━━\n✅ Kết nối thành công từ Bảng Quản Trị Admin.\n⏰ Thời gian: ${new Date().toLocaleString('vi-VN')}`,
              parse_mode: 'HTML'
            })
          });
          const data = await res.json();
          if (data.ok) {
            showToast('✅ Đã gửi tin nhắn test thành công về Telegram của bạn!');
          } else {
            alert('Lỗi Telegram: ' + (data.description || 'Không gửi được'));
          }
        } catch (e) {
          alert('Lỗi kết nối API Telegram: ' + e.message);
        }
      };

      // ========================================================
      // 1. GIAO DIỆN ĐĂNG NHẬP (NẾU CHƯA ĐĂNG NHẬP)
      // ========================================================
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#030509] via-[#0b101b] to-[#030509] relative overflow-hidden">
            {/* Background glowing orbs */}
            <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-pink-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="glass-card max-w-md w-full rounded-3xl p-8 border border-white/10 shadow-2xl relative z-10">
              <div className="text-center mb-7">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 mx-auto flex items-center justify-center text-2xl text-white shadow-lg shadow-emerald-500/30 mb-4">
                  <i className="fa-solid fa-shield-halved"></i>
                </div>
                <h2 className="text-2xl font-black text-white tracking-tight">ADMIN PORTAL</h2>
                <p className="text-xs text-slate-400 mt-1">Đăng nhập Bảng Điều Khiển Quản Trị Hệ Thống</p>
                <span className="inline-block mt-2 px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-mono font-bold">
                  Bản quyền: Anh Tuấn iOS
                </span>
              </div>

              {loginError && (
                <div className="mb-4 p-3 rounded-xl bg-red-500/15 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
                  <i className="fa-solid fa-circle-exclamation flex-shrink-0"></i>
                  <span>{loginError}</span>
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="text-xs font-bold text-slate-300 block mb-1.5 flex items-center gap-1.5">
                    <i className="fa-solid fa-user text-emerald-400"></i> Tài khoản Admin:
                  </label>
                  <input 
                    type="text"
                    value={loginUser}
                    onChange={(e) => setLoginUser(e.target.value)}
                    placeholder="Nhập tên đăng nhập..."
                    className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-white/15 text-white text-xs font-medium focus:outline-none focus:border-emerald-500 transition shadow-inner"
                    required
                  />
                </div>

                <div>
                  <label className="text-xs font-bold text-slate-300 block mb-1.5 flex items-center gap-1.5">
                    <i className="fa-solid fa-key text-emerald-400"></i> Mật khẩu:
                  </label>
                  <input 
                    type="password"
                    value={loginPass}
                    onChange={(e) => setLoginPass(e.target.value)}
                    placeholder="Nhập mật khẩu quản trị..."
                    className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-white/15 text-white text-xs font-medium focus:outline-none focus:border-emerald-500 transition shadow-inner"
                    required

                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowVoucherModal(false)}
                      className="flex-1 py-2.5 rounded-xl bg-white/10 text-slate-300 font-bold text-xs"
                    >
                      Hủy
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-extrabold text-xs shadow-md"
                    >
                      Lưu Mã
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: HƯỚNG DẪN & NHẬP GITHUB TOKEN ĐỂ ĐẨY CODE CLOUD */}
          {/* ======================================================== */}
          {showTokenModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
              <div className="glass-card max-w-lg w-full rounded-3xl p-6 sm:p-7 border border-emerald-500/40 shadow-2xl relative text-left">
                <button 
                  onClick={() => setShowTokenModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-slate-400 hover:text-white flex items-center justify-center text-xs transition"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="flex items-center gap-3 mb-4">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl flex-shrink-0 border border-emerald-500/30">
                    <i className="fa-brands fa-github"></i>
                  </div>
                  <div>
                    <h3 className="font-black text-sm sm:text-base text-white">CẦN GITHUB TOKEN ĐỂ LƯU CLOUD</h3>
                    <p className="text-xs text-slate-400">Chỉ cần dán 1 lần duy nhất để website tự đẩy code lên GitHub</p>
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-900/90 border border-white/10 text-xs text-slate-300 space-y-2 mb-4">
                  <p className="font-bold text-emerald-400 flex items-center gap-1.5">
                    <i className="fa-solid fa-circle-question"></i> Cách lấy Token GitHub trong 30 giây:
                  </p>
                  <ol className="list-decimal list-inside space-y-1 text-[11px] text-slate-300">
                    <li>Bấm vào link: <a href="https://github.com/settings/tokens/new?scopes=repo&description=LocketAdminToken" target="_blank" rel="noopener noreferrer" className="text-sky-400 underline font-bold hover:text-sky-300">Tạo Token GitHub Ngay (Đã chọn sẵn quyền repo)</a></li>
                    <li>Kéo xuống cuối trang bấm nút màu xanh: <b>Generate token</b>.</li>
                    <li>Copy chuỗi mã bắt đầu bằng <code>ghp_...</code> và dán vào ô bên dưới:</li>
                  </ol>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const tokenVal = tokenModalInput.trim();
                  if (!tokenVal) {
                    alert('Vui lòng dán mã GitHub Token (bắt đầu bằng ghp_...)');
                    return;
                  }
                  setConfig(prev => ({
                    ...prev,
                    githubConfig: { ...prev.githubConfig, defaultGhToken: tokenVal }
                  }));
                  localStorage.setItem('at_gh_token', tokenVal);
                  setShowTokenModal(false);
                  showToast('Đã lưu Token! Đang tiến hành đẩy code lên GitHub...');
                  setTimeout(() => handleSaveAndSyncGitHub(), 300);
                }} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Dán GitHub Personal Access Token (ghp_...):</label>
                    <input 
                      type="password"
                      value={tokenModalInput}
                      onChange={(e) => setTokenModalInput(e.target.value)}
                      placeholder="VD: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
                      className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-emerald-500/50 text-white text-xs font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
                      required
                    />
                  </div>

                  <div className="flex gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowTokenModal(false)}
                      className="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/15 text-slate-300 font-bold text-xs"
                    >
                      Để Sau
                    </button>
                    <button
                      type="submit"
                      className="flex-[2] py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-extrabold text-xs uppercase shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-solid fa-cloud-arrow-up"></i> Lưu Token & Đẩy Ngay
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast.show && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900/95 border border-emerald-500/50 text-white text-xs font-bold shadow-2xl flex items-center gap-2.5 animate-bounce">
              <i className={`fa-solid ${toast.icon} text-emerald-400 text-base`}></i>
              <span>{toast.text}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
