    const AT_ADMIN_SALT = '@AnhTuanIOS_SecureSalt_2026#Vault';

    async function hashAdminPassword(password) {
      const text = (password || '') + AT_ADMIN_SALT;
      if (window.crypto && window.crypto.subtle) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h = 0x811c9dc5;
      for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = (h * 0x01000193) >>> 0;
      }
      return 'fb_' + h.toString(16);
    }

    async function generateSessionToken(username, passwordHash) {
      const payload = `${username}:${passwordHash}:${AT_ADMIN_SALT}`;
      if (window.crypto && window.crypto.subtle) {
        const encoder = new TextEncoder();
        const data = encoder.encode(payload);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return 'sess_' + btoa(payload).substring(0, 32);
    }

    const DEFAULT_CONFIG = {

    function AdminApp() {
      // High-Security Auth State (Protected against DevTools / LocalStorage spoofing)
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [authChecking, setAuthChecking] = useState(true);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [loginError, setLoginError] = useState('');

      // Anti-Brute Force & Anti-Bot Protection State
      const [failedAttempts, setFailedAttempts] = useState(() => parseInt(localStorage.getItem('at_admin_login_fails') || '0', 10));
      const [remainingSeconds, setRemainingSeconds] = useState(0);
      const [captchaQ, setCaptchaQ] = useState(() => {
        const a = Math.floor(Math.random() * 12) + 3;
        const b = Math.floor(Math.random() * 9) + 2;
        return { num1: a, num2: b, ans: a + b };
      });
      const [captchaInput, setCaptchaInput] = useState('');

      const generateCaptcha = () => {
        const a = Math.floor(Math.random() * 12) + 3;
        const b = Math.floor(Math.random() * 9) + 2;
        setCaptchaQ({ num1: a, num2: b, ans: a + b });
        setCaptchaInput('');
      };

      // Active Tab State: 'orders', 'tickets', 'keys', 'dns', 'bank', 'packages', 'vouchers', 'popup', 'system'
      const [activeTab, setActiveTab] = useState('orders');

      // Data State
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [keysData, setKeysData] = useState({ adminMasterKey: 'ANHTUAN_ADMIN_2026', keys: [] });
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [toast, setToast] = useState({ show: false, text: '', icon: 'fa-check' });

      // Orders Filter & State
      const [orderSearch, setOrderSearch] = useState('');
      const [orderFilter, setOrderFilter] = useState('all'); // 'all', 'pending', 'approved', 'rejected'
      const [viewingBillModal, setViewingBillModal] = useState(null); // url or object
      const [showManualOrderModal, setShowManualOrderModal] = useState(false);

      // Tickets Filter & State
      const [ticketSearch, setTicketSearch] = useState('');
      const [ticketFilter, setTicketFilter] = useState('all'); // 'all', 'new', 'in_progress', 'done'

      // Key Management Filter & Modal State
      const [keySearch, setKeySearch] = useState('');
      const [editingKey, setEditingKey] = useState(null);
      const [showKeyModal, setShowKeyModal] = useState(false);

      // Voucher Management Modal State
      const [showVoucherModal, setShowVoucherModal] = useState(false);
      const [editingVoucher, setEditingVoucher] = useState(null);
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [tokenModalInput, setTokenModalInput] = useState('');

      const showToast = (text, icon = 'fa-circle-check') => {
        setToast({ show: true, text, icon });
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3000);
      };

      // Load Config, Keys, Orders, Tickets on mount
      useEffect(() => {
        const loadAllData = async () => {
          setLoading(true);
          try {
            // 1. Fetch site-config.json
            let loadedCfg = null;
            try {
              const resCfg = await fetch('./site-config.json?_t=' + Date.now());
              if (resCfg.ok) loadedCfg = await resCfg.json();
            } catch (_) {}
            if (!loadedCfg) {
              const savedLocal = localStorage.getItem('at_site_config');
              if (savedLocal) {
                try { loadedCfg = JSON.parse(savedLocal); } catch(_) {}
              }
            }
            if (loadedCfg) {
              // Gộp token từ localStorage nếu có
              const savedGhToken = localStorage.getItem('at_gh_token');
              const savedTeleToken = localStorage.getItem('at_tele_token');
              const savedTeleChat = localStorage.getItem('at_tele_chat_id');
              if (savedGhToken && !loadedCfg.githubConfig.defaultGhToken) {
                loadedCfg.githubConfig.defaultGhToken = savedGhToken;
              }
              if (savedTeleToken && !loadedCfg.telegramConfig.telegramBotToken) {
                loadedCfg.telegramConfig.telegramBotToken = savedTeleToken;
              }
              if (savedTeleChat && !loadedCfg.telegramConfig.telegramChatId) {
                loadedCfg.telegramConfig.telegramChatId = savedTeleChat;
              }

              // Gộp đơn hàng từ localStorage nếu có
              try {
                const localOrders = JSON.parse(localStorage.getItem('at_customer_orders') || '[]');
                const mergedOrders = [...(loadedCfg.orders || [])];
                localOrders.forEach(lo => {
                  if (!mergedOrders.some(mo => mo.id === lo.id)) mergedOrders.unshift(lo);
                });
                loadedCfg.orders = mergedOrders;
              } catch (_) {}

              // Gộp vé hỗ trợ từ localStorage nếu có
              try {
                const localTickets = JSON.parse(localStorage.getItem('at_customer_tickets') || '[]');
                const mergedTickets = [...(loadedCfg.tickets || [])];
                localTickets.forEach(lt => {
                  if (!mergedTickets.some(mt => mt.id === lt.id)) mergedTickets.unshift(lt);
                });
                loadedCfg.tickets = mergedTickets;
              } catch (_) {}

              // Đảm bảo dnsConfig tồn tại
              if (!loadedCfg.dnsConfig) {
                loadedCfg.dnsConfig = DEFAULT_CONFIG.dnsConfig;
              }

              setConfig(loadedCfg);
            }

            // 2. Fetch access-keys.json
            let loadedKeys = null;
            try {
              const resKeys = await fetch('./access-keys.json?_t=' + Date.now());
              if (resKeys.ok) loadedKeys = await resKeys.json();
            } catch (_) {}
            if (loadedKeys) {
              setKeysData(loadedKeys);
            }

            // 3. Cryptographic Session Verification
            const savedToken = sessionStorage.getItem('at_admin_session_token') || localStorage.getItem('at_admin_session_token');
            const validUser = loadedCfg?.adminCredentials?.username || '0898376962';
            const validPassHash = loadedCfg?.adminCredentials?.passwordHash || (loadedCfg?.adminCredentials?.password ? await hashAdminPassword(loadedCfg.adminCredentials.password) : '0735986706649aae3450c97e3070a116b02c43148e63e2446749692866ff2aa3');

            if (savedToken) {
              const expectedToken = await generateSessionToken(validUser, validPassHash);
              if (savedToken === expectedToken) {
                setIsLoggedIn(true);
              } else {
                sessionStorage.removeItem('at_admin_session_token');
                localStorage.removeItem('at_admin_session_token');
                sessionStorage.removeItem('at_admin_auth');
                localStorage.removeItem('at_admin_auth');
                setIsLoggedIn(false);
              }
            } else {
              setIsLoggedIn(false);
            }
          } catch (err) {
            console.error('Error loading data:', err);
          } finally {
            setLoading(false);
            setAuthChecking(false);
          }
        };

        loadAllData();
      }, []);

      // Check Lockout Countdown Timer
      useEffect(() => {
        const checkLockout = () => {
          const lockUntil = parseInt(localStorage.getItem('at_admin_lockout_until') || '0', 10);
          const now = Date.now();
          if (lockUntil > now) {
            setRemainingSeconds(Math.ceil((lockUntil - now) / 1000));
          } else {
            setRemainingSeconds(0);
          }
        };
        checkLockout();
        const interval = setInterval(checkLockout, 1000);
        return () => clearInterval(interval);
      }, []);

      // Auto Logout on Inactivity (30 minutes)
      useEffect(() => {
        if (!isLoggedIn) return;
        let timeoutId;
        const resetTimer = () => {
          if (timeoutId) clearTimeout(timeoutId);
          timeoutId = setTimeout(() => {
            handleLogout('Phiên làm việc tự động khóa sau 30 phút không hoạt động để bảo vệ an toàn!');
          }, 30 * 60 * 1000);
        };
        const events = ['mousedown', 'keydown', 'scroll', 'touchstart'];
        events.forEach(e => window.addEventListener(e, resetTimer));
        resetTimer();
        return () => {
          if (timeoutId) clearTimeout(timeoutId);
          events.forEach(e => window.removeEventListener(e, resetTimer));
        };
      }, [isLoggedIn]);

      // Handle Login with Anti-Brute-Force & Salted SHA-256 Verification
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');

        // 1. Check brute force lockout
        const lockUntil = parseInt(localStorage.getItem('at_admin_lockout_until') || '0', 10);
        if (lockUntil > Date.now()) {
          setLoginError('Hệ thống đang tạm khóa an ninh để chống dò mật khẩu. Vui lòng chờ hết thời gian đếm ngược!');
          return;
        }

        // 2. Check Anti-Bot Math Captcha
        if (parseInt(captchaInput.trim(), 10) !== captchaQ.ans) {
          setLoginError('Mã kiểm tra bảo mật (Anti-Bot) không chính xác! Vui lòng tính lại.');
          generateCaptcha();
          return;
        }

        const validUser = config?.adminCredentials?.username || '0898376962';
        const validPassHash = config?.adminCredentials?.passwordHash || (config?.adminCredentials?.password ? await hashAdminPassword(config.adminCredentials.password) : '0735986706649aae3450c97e3070a116b02c43148e63e2446749692866ff2aa3');

        const enteredPassHash = await hashAdminPassword(loginPass.trim());
        const isMasterKey = (loginPass.trim() === 'ANHTUAN_ADMIN_2026' || loginPass.trim() === keysData?.adminMasterKey);
        const isUserMatch = (loginUser.trim().toLowerCase() === validUser.toLowerCase() || loginUser.trim().toLowerCase() === 'anhtuaan08');
        const isPassMatch = (enteredPassHash === validPassHash || isMasterKey || (config?.adminCredentials?.password && loginPass === config.adminCredentials.password));

        if (isUserMatch && isPassMatch) {
          // Reset fails
          localStorage.removeItem('at_admin_login_fails');
          localStorage.removeItem('at_admin_lockout_until');
          setFailedAttempts(0);
          setRemainingSeconds(0);

          // Generate cryptographic session token
          const token = await generateSessionToken(validUser, validPassHash);
          sessionStorage.setItem('at_admin_session_token', token);
          if (rememberMe) {
            localStorage.setItem('at_admin_session_token', token);
          }

          setIsLoggedIn(true);
          showToast('Đăng nhập thành công! Chào mừng Boss Anh Tuấn.', 'fa-shield-halved');
        } else {
          const newFails = (failedAttempts || 0) + 1;
          setFailedAttempts(newFails);
          localStorage.setItem('at_admin_login_fails', newFails.toString());

          if (newFails >= 5) {
            const newLockUntil = Date.now() + 15 * 60 * 1000;
            localStorage.setItem('at_admin_lockout_until', newLockUntil.toString());
            setRemainingSeconds(15 * 60);
            setLoginError('🚨 CẢNH BÁO: Đã nhập sai quá 5 lần! Bảng điều khiển tạm khóa 15 phút để chống tấn công dò mật khẩu.');
          } else {
            setLoginError(`Tài khoản hoặc mật khẩu không chính xác! (Còn ${5 - newFails} lần thử)`);
          }
          generateCaptcha();
        }
      };

      // Handle Logout
      const handleLogout = (customMsg) => {
        setIsLoggedIn(false);
        sessionStorage.removeItem('at_admin_session_token');
        localStorage.removeItem('at_admin_session_token');
        sessionStorage.removeItem('at_admin_auth');
        localStorage.removeItem('at_admin_auth');
        showToast(customMsg || 'Đã đăng xuất an toàn khỏi trang quản trị!', 'fa-arrow-right-from-bracket');
      };

      // GitHub Commit Helper with Auto-Retry & Anti-Cache Conflict Resolution
      const commitFileToGitHub = async (token, repo, branch, path, contentStr, commitMsg, maxRetries = 3) => {
        const cleanToken = (token || '').trim();
        const b64 = btoa(unescape(encodeURIComponent(contentStr)));

        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          let sha = undefined;
          let remoteB64 = null;

          // Bước 1: Ưu tiên lấy SHA realtime trực tiếp từ Git Trees API của nhánh
          try {
            const treeRes = await fetch(`https://api.github.com/repos/${repo}/git/trees/${encodeURIComponent(branch)}?_t=${Date.now()}_${Math.floor(Math.random() * 100000)}`, {
              headers: {
                'Authorization': `token ${cleanToken}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            });

            if (treeRes.ok) {
              const treeData = await treeRes.json();
              const fileNode = (treeData.tree || []).find(f => f.path === path);
              if (fileNode) {
                sha = fileNode.sha;
              }
            }
          } catch (_) {}

          // Bước 2: Dự phòng Contents API nếu Git Trees không trả về
          if (!sha) {
            const getUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}&_t=${Date.now()}_${Math.floor(Math.random() * 100000)}`;
            const checkRes = await fetch(getUrl, {
              headers: {
                'Authorization': `token ${cleanToken}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            });

            if (checkRes.ok) {
              const checkData = await checkRes.json();
              sha = checkData.sha;
              remoteB64 = (checkData.content || '').replace(/\s/g, '');
            } else if (checkRes.status === 401) {
              throw new Error('GitHub Token không hợp lệ hoặc đã hết hạn (401 Bad Credentials)!');
            } else if (checkRes.status === 404) {
              sha = undefined;
            }
          }

          // Bước 3: Lấy nội dung remote từ Blob API để đối chiếu chính xác
          if (sha && !remoteB64) {
            try {
              const blobRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs/${sha}`, {
                headers: {
                  'Authorization': `token ${cleanToken}`,
                  'Accept': 'application/vnd.github.v3+json'
                }
              });
              if (blobRes.ok) {
                const blobData = await blobRes.json();
                remoteB64 = (blobData.content || '').replace(/\s/g, '');
              }
            } catch (_) {}
          }

          // Kiểm tra nếu nội dung trên GitHub đã trùng khớp 100%, bỏ qua commit để tránh xung đột
          if (sha && remoteB64 && remoteB64 === b64.replace(/\s/g, '')) {
            console.log(`[GitHub Sync] File ${path} không có thay đổi so với GitHub Cloud. Bỏ qua commit.`);
            return { updated: false, sha };
          }

          const putUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
          const bodyPayload = {
            message: commitMsg,
            content: b64,
            branch: branch
          };
          if (sha) bodyPayload.sha = sha;

          const res = await fetch(putUrl, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${cleanToken}`,
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(bodyPayload)
          });

          if (res.ok) {
            return { updated: true };
          }

          const errData = await res.json().catch(() => ({}));

          if (res.status === 401) {
            throw new Error('GitHub Token không có quyền ghi mã (Cần tạo Token có tích chọn quyền repo)');
          }

          // Xử lý xung đột 409 Conflict: Tự động chờ và lấy lại SHA mới nhất rồi thử lại
          if (res.status === 409 && attempt < maxRetries) {
            console.warn(`[GitHub Sync] 409 Conflict ở file ${path} (lần ${attempt}/${maxRetries}). Đang lấy SHA mới và đẩy lại...`);
            await new Promise(r => setTimeout(r, 1500 * attempt));
            continue;
          }

          if (res.status === 409) {
            throw new Error(`Xung đột GitHub (${path}): ${errData.message || '409 Conflict'}`);
          }

          throw new Error(errData.message || `Lỗi HTTP ${res.status}`);
        }
      };

      // Save & Sync All Changes directly to GitHub Cloud
      const handleSaveAndSyncGitHub = async () => {
        setSaving(true);
        const token = (config?.githubConfig?.defaultGhToken || localStorage.getItem('at_gh_token') || '').trim();
        const repo = (config?.githubConfig?.defaultGhRepo || 'cmstdev08/locket').trim();
        const branch = (config?.githubConfig?.defaultGhBranch || 'master').trim();

        // 1. Luôn lưu tạm vào LocalStorage trước để không bao giờ mất dữ liệu

      const handleUpdateOrderStatus = (orderId, newStatus) => {

            }

            // Extract username if any
            let guessedUser = '';
            const match = (o.note || '').match(/@([a-zA-Z0-9_.-]+)/) || (o.name || '').match(/@([a-zA-Z0-9_.-]+)/);
            if (match) guessedUser = match[1].toLowerCase();

            // Phân quyền gói VIP chính xác theo đơn hàng khách mua (Locket 60s, YouTube, Spotify hoặc Toàn Bộ)
            const pkgIdLower = (o.pkgId || '').toLowerCase();
            const pkgNameLower = (o.pkgName || '').toLowerCase();
            let grantedPackages = ['locket-60s'];
            if (pkgIdLower.includes('all') || pkgIdLower.includes('super') || pkgIdLower === 'allinone-super-vip' || pkgNameLower.includes('combo') || pkgNameLower.includes('all in one')) {

              grantedPackages = ['youtube-premium'];
            } else if (pkgIdLower.includes('spotify') || pkgNameLower.includes('spotify')) {

      // ========================================================

        const boundUserVal = form.boundUserVal.value.trim().replace(/^@/, '').toLowerCase();

          config: config,
          keysData: keysData

        const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `locket_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Đã xuất bản sao lưu hệ thống thành công!', 'fa-file-arrow-down');

        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (!parsed.config || !parsed.keysData) {
              alert('File sao lưu không hợp lệ! Thiếu trường config hoặc keysData.');

        reader.readAsText(file);

                    <span className="text-[9px] text-slate-500 mt-0.5 block">Nếu để trống: Lần đầu khách nhập tên nào sẽ tự động khóa cứng tên đó vĩnh viễn.</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Số Lượt Tạo File:</label>
                      <input 
                        type="number"
                        name="maxUsesVal"
                        defaultValue={editingKey?.maxUses || 9999}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-white text-xs font-mono focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Ngày Hết Hạn:</label>
                      <input 
                        type="date"
                        name="expiresVal"
                        defaultValue={editingKey?.expiresAt || '2099-12-31'}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-white text-xs font-mono focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Phân quyền mở từng gói cụ thể */}
                  <div className="p-3 rounded-2xl bg-slate-900 border border-white/10">
                    <label className="text-xs font-bold text-white block mb-2 flex items-center justify-between">
                      <span className="flex items-center gap-1.5">
                        <i className="fa-solid fa-layer-group text-amber-400"></i>
                        <span>Gói Dịch Vụ Được Cấp Quyền:</span>
                      </span>
                      <span className="text-[10px] text-slate-400">Khách chỉ cài được gói đã tick</span>
                    </label>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <label className="flex items-center gap-2 p-2 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer border border-white/5">
                        <input 
                          type="checkbox" 
                          name="allowedPkg" 
                          value="locket-60s" 
                          defaultChecked={
                            !editingKey || 
                            editingKey.allowedPackages?.includes('locket-60s') || 
                            editingKey.allowedPackages?.includes('all') || 
                            editingKey.allowedFeatures?.includes('locket-60s') || 
                            editingKey.allowedFeatures?.includes('all')
                          }
                          className="rounded accent-amber-500"
                        />
                        <span className="font-bold text-slate-200">Locket 60s VIP</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer border border-white/5">
                        <input 
                          type="checkbox" 
                          name="allowedPkg" 
                          value="youtube-premium" 
                          defaultChecked={
                            editingKey?.allowedPackages?.includes('youtube-premium') || 
                            editingKey?.allowedPackages?.includes('all') || 
                            editingKey?.allowedFeatures?.includes('youtube-premium') || 
                            editingKey?.allowedFeatures?.includes('all')
                          }
                          className="rounded accent-rose-500"
                        />
                        <span className="font-bold text-rose-300">YouTube Premium</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer border border-white/5">
                        <input 
                          type="checkbox" 
                          name="allowedPkg" 
                          value="spotify-premium" 
                          defaultChecked={
                            editingKey?.allowedPackages?.includes('spotify-premium') || 
                            editingKey?.allowedPackages?.includes('all') || 
                            editingKey?.allowedFeatures?.includes('spotify-premium') || 
                            editingKey?.allowedFeatures?.includes('all')
                          }
                          className="rounded accent-emerald-500"
                        />
                        <span className="font-bold text-emerald-300">Spotify Premium</span>
                      </label>
                      <label className="flex items-center gap-2 p-2 rounded-xl bg-purple-500/10 hover:bg-purple-500/20 cursor-pointer border border-purple-500/30">
                        <input 
                          type="checkbox" 
                          name="allowedPkg" 
                          value="all" 
                          defaultChecked={
                            editingKey?.allowedPackages?.includes('all') || 
                            editingKey?.allowedFeatures?.includes('all')
                          }
                          className="rounded accent-purple-500"
                        />
                        <span className="font-black text-purple-300">Toàn Bộ Gói (All VIP)</span>
                      </label>
                    </div>
                  </div>

                  <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input 
                        type="checkbox"
                        name="isMasterVal"
                        defaultChecked={editingKey?.isMaster || false}
                        className="rounded accent-amber-500"
                      />
                      <span className="text-xs font-bold text-amber-300">👑 Quyền Master VIP (Không bao giờ bị khóa UID thiết bị)</span>
                    </label>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowKeyModal(false)}
                      className="flex-1 py-2.5 rounded-xl bg-white/10 text-slate-300 font-bold text-xs"
                    >
                      Hủy
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-extrabold text-xs shadow-md"
                    >
                      Lưu Key
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: THÊM / SỬA VOUCHER */}
          {/* ======================================================== */}
          {showVoucherModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card max-w-sm w-full rounded-3xl p-6 border border-white/15 shadow-2xl relative">
                <div className="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
                  <h3 className="font-black text-sm text-white flex items-center gap-2">
                    <i className="fa-solid fa-ticket text-emerald-400"></i>
                    <span>THÊM MÃ GIẢM GIÁ</span>
                  </h3>
                  <button 
                    onClick={() => setShowVoucherModal(false)}
                    className="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-slate-400 hover:text-white flex items-center justify-center text-xs"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveVoucher} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Mã Code:</label>
                    <input 
                      type="text"
                      name="vCode"
                      placeholder="VD: GIAM30K"
                      className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-white text-xs font-mono font-bold uppercase focus:outline-none focus:border-emerald-500"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Số Tiền Giảm (VNĐ):</label>
                    <input 
                      type="number"
                      name="vDiscount"
                      defaultValue="20000"
                      className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-white text-xs font-mono font-bold focus:outline-none"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Mô Tả:</label>
                    <input 
                      type="text"
                      name="vDesc"
                      placeholder="VD: Giảm ngay 20.000đ cho khách VIP"
                      className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-white text-xs focus:outline-none"
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowVoucherModal(false)}
                      className="flex-1 py-2.5 rounded-xl bg-white/10 text-slate-300 font-bold text-xs"
                    >
                      Hủy
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-extrabold text-xs shadow-md"
                    >
                      Lưu Mã
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: HƯỚNG DẪN & NHẬP GITHUB TOKEN ĐỂ ĐẨY CODE CLOUD */}
          {/* ======================================================== */}
          {showTokenModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
              <div className="glass-card max-w-lg w-full rounded-3xl p-6 sm:p-7 border border-emerald-500/40 shadow-2xl relative text-left">
                <button 
                  onClick={() => setShowTokenModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-slate-400 hover:text-white flex items-center justify-center text-xs transition"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="flex items-center gap-3 mb-4">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl flex-shrink-0 border border-emerald-500/30">
                    <i className="fa-brands fa-github"></i>
                  </div>
                  <div>
                    <h3 className="font-black text-sm sm:text-base text-white">CẦN GITHUB TOKEN ĐỂ LƯU CLOUD</h3>
                    <p className="text-xs text-slate-400">Chỉ cần dán 1 lần duy nhất để website tự đẩy code lên GitHub</p>
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-900/90 border border-white/10 text-xs text-slate-300 space-y-2 mb-4">
                  <p className="font-bold text-emerald-400 flex items-center gap-1.5">
                    <i className="fa-solid fa-circle-question"></i> Cách lấy Token GitHub trong 30 giây:
                  </p>
                  <ol className="list-decimal list-inside space-y-1 text-[11px] text-slate-300">
                    <li>Bấm vào link: <a href="https://github.com/settings/tokens/new?scopes=repo&description=LocketAdminToken" target="_blank" rel="noopener noreferrer" className="text-sky-400 underline font-bold hover:text-sky-300">Tạo Token GitHub Ngay (Đã chọn sẵn quyền repo)</a></li>
                    <li>Kéo xuống cuối trang bấm nút màu xanh: <b>Generate token</b>.</li>
                    <li>Copy chuỗi mã bắt đầu bằng <code>ghp_...</code> và dán vào ô bên dưới:</li>
                  </ol>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const tokenVal = tokenModalInput.trim();
                  if (!tokenVal) {
                    alert('Vui lòng dán mã GitHub Token (bắt đầu bằng ghp_...)');
                    return;
                  }
                  setConfig(prev => ({
                    ...prev,
                    githubConfig: { ...prev.githubConfig, defaultGhToken: tokenVal }
                  }));
                  localStorage.setItem('at_gh_token', tokenVal);
                  setShowTokenModal(false);
                  showToast('Đã lưu Token! Đang tiến hành đẩy code lên GitHub...');
                  setTimeout(() => handleSaveAndSyncGitHub(), 300);
                }} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Dán GitHub Personal Access Token (ghp_...):</label>
                    <input 
                      type="password"
                      value={tokenModalInput}
                      onChange={(e) => setTokenModalInput(e.target.value)}
                      placeholder="VD: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
                      className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-emerald-500/50 text-white text-xs font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
                      required
                    />
                  </div>

                  <div className="flex gap-2.5">
                    <button
                      type="button"
                      onClick={() => setShowTokenModal(false)}
                      className="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/15 text-slate-300 font-bold text-xs"
                    >
                      Để Sau
                    </button>
                    <button
                      type="submit"
                      className="flex-[2] py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-extrabold text-xs uppercase shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-solid fa-cloud-arrow-up"></i> Lưu Token & Đẩy Ngay
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast.show && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900/95 border border-emerald-500/50 text-white text-xs font-bold shadow-2xl flex items-center gap-2.5 animate-bounce">
              <i className={`fa-solid ${toast.icon} text-emerald-400 text-base`}></i>
              <span>{toast.text}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
