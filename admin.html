  <!-- React Babel Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_CONFIG = {
      adminCredentials: { username: "anhtuaan08", password: "admin2026@anhtuan" },
      bankConfig: {
        bankNumber: "7898376962",
        bankName: "Vietcombank",
        bankOwner: "TRAN VAN ANH TUAN",
        momoNumber: "0898376962",
        paypalUrl: "https://paypal.me/anhtuaan"
      },
      contactConfig: {
        adminTelegram: "https://t.me/anhtuaan",
        adminInstagram: "https://www.instagram.com/anhtuaan.08",
        adminZalo: "https://zalo.me/0898376962",
        hotline: "0898.376.962"
      },
      telegramConfig: { telegramBotToken: "", telegramChatId: "" },
      githubConfig: { defaultGhRepo: "cmstdev08/locket", defaultGhBranch: "master", defaultGhToken: "" },
      popupConfig: {
        enabled: false,
        title: "🎉 THÔNG BÁO TỪ ANH TUẤN iOS",
        badge: "TIN NÓNG",
        content: "Gói Locket 60s VIP vĩnh viễn đang mở bán với giá ưu đãi! Chúc bạn có trải nghiệm tuyệt vời.",
        btnText: "Xem Ngay",
        btnLink: "#pricing"
      },
      dnsConfig: {
        isLocked: false,
        requireKey: true,
        lockNotice: "Hệ thống DNS hiện đang tạm bảo trì để nâng cấp chứng chỉ mới. Quý khách vui lòng quay lại sau!",
        locketGoldUrl: "./dns/locketgold.mobileconfig",
        locket60sUrl: "./dns/locketgold.mobileconfig",
        rootCaUrl: "./dns/rootca.mobileconfig"
      },
      packages: [],
      vouchers: [],
      orders: [],
      tickets: []
    };

    function AdminApp() {
      // Auth State
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return sessionStorage.getItem('at_admin_auth') === 'true' || localStorage.getItem('at_admin_auth') === 'true';
      });
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [loginError, setLoginError] = useState('');

      // Active Tab State: 'orders', 'tickets', 'keys', 'dns', 'bank', 'packages', 'vouchers', 'popup', 'system'
      const [activeTab, setActiveTab] = useState('orders');

      // Data State
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [keysData, setKeysData] = useState({ adminMasterKey: 'ANHTUAN_ADMIN_2026', keys: [] });
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [toast, setToast] = useState({ show: false, text: '', icon: 'fa-check' });

      // Orders Filter & State
      const [orderSearch, setOrderSearch] = useState('');
      const [orderFilter, setOrderFilter] = useState('all'); // 'all', 'pending', 'approved', 'rejected'
      const [viewingBillModal, setViewingBillModal] = useState(null); // url or object
      const [showManualOrderModal, setShowManualOrderModal] = useState(false);

      // Tickets Filter & State
      const [ticketSearch, setTicketSearch] = useState('');
      const [ticketFilter, setTicketFilter] = useState('all'); // 'all', 'new', 'in_progress', 'done'

      // Key Management Filter & Modal State
      const [keySearch, setKeySearch] = useState('');
      const [editingKey, setEditingKey] = useState(null);
      const [showKeyModal, setShowKeyModal] = useState(false);

      // Voucher Management Modal State
      const [showVoucherModal, setShowVoucherModal] = useState(false);
      const [editingVoucher, setEditingVoucher] = useState(null);
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [tokenModalInput, setTokenModalInput] = useState('');

      const showToast = (text, icon = 'fa-circle-check') => {
        setToast({ show: true, text, icon });
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 3000);
      };

      // Load Config, Keys, Orders, Tickets on mount
      useEffect(() => {
        const loadAllData = async () => {
          setLoading(true);
          try {
            // 1. Fetch site-config.json
            let loadedCfg = null;
            try {
              const resCfg = await fetch('./site-config.json?_t=' + Date.now());
              if (resCfg.ok) loadedCfg = await resCfg.json();
            } catch (_) {}
            if (!loadedCfg) {
              const savedLocal = localStorage.getItem('at_site_config');
              if (savedLocal) {
                try { loadedCfg = JSON.parse(savedLocal); } catch(_) {}
              }
            }
            if (loadedCfg) {
              // Gộp token từ localStorage nếu có
              const savedGhToken = localStorage.getItem('at_gh_token');
              const savedTeleToken = localStorage.getItem('at_tele_token');
              const savedTeleChat = localStorage.getItem('at_tele_chat_id');
              if (savedGhToken && !loadedCfg.githubConfig.defaultGhToken) {
                loadedCfg.githubConfig.defaultGhToken = savedGhToken;
              }
              if (savedTeleToken && !loadedCfg.telegramConfig.telegramBotToken) {
                loadedCfg.telegramConfig.telegramBotToken = savedTeleToken;
              }
              if (savedTeleChat && !loadedCfg.telegramConfig.telegramChatId) {
                loadedCfg.telegramConfig.telegramChatId = savedTeleChat;
              }

              // Gộp đơn hàng từ localStorage nếu có
              try {
                const localOrders = JSON.parse(localStorage.getItem('at_customer_orders') || '[]');
                const mergedOrders = [...(loadedCfg.orders || [])];
                localOrders.forEach(lo => {
                  if (!mergedOrders.some(mo => mo.id === lo.id)) mergedOrders.unshift(lo);
                });
                loadedCfg.orders = mergedOrders;
              } catch (_) {}

              // Gộp vé hỗ trợ từ localStorage nếu có
              try {
                const localTickets = JSON.parse(localStorage.getItem('at_customer_tickets') || '[]');
                const mergedTickets = [...(loadedCfg.tickets || [])];
                localTickets.forEach(lt => {
                  if (!mergedTickets.some(mt => mt.id === lt.id)) mergedTickets.unshift(lt);
                });
                loadedCfg.tickets = mergedTickets;
              } catch (_) {}

              // Đảm bảo dnsConfig tồn tại
              if (!loadedCfg.dnsConfig) {
                loadedCfg.dnsConfig = DEFAULT_CONFIG.dnsConfig;
              }

              setConfig(loadedCfg);
            }

            // 2. Fetch access-keys.json
            let loadedKeys = null;
            try {
              const resKeys = await fetch('./access-keys.json?_t=' + Date.now());
              if (resKeys.ok) loadedKeys = await resKeys.json();
            } catch (_) {}
            if (loadedKeys) {
              setKeysData(loadedKeys);
            }
          } catch (err) {
            console.error('Error loading data:', err);
          } finally {
            setLoading(false);
          }
        };

        loadAllData();
      }, []);

      // Handle Login
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const validUser = config?.adminCredentials?.username || 'anhtuaan08';
        const validPass = config?.adminCredentials?.password || 'admin2026@anhtuan';

        if (loginUser.trim() === validUser && loginPass === validPass) {
          setIsLoggedIn(true);
          if (rememberMe) localStorage.setItem('at_admin_auth', 'true');
          sessionStorage.setItem('at_admin_auth', 'true');
          showToast('Đăng nhập thành công! Chào mừng Boss Anh Tuấn.', 'fa-crown');
        } else {
          setLoginError('Tài khoản hoặc mật khẩu không chính xác!');
        }
      };

      // Handle Logout
      const handleLogout = () => {
        setIsLoggedIn(false);
        sessionStorage.removeItem('at_admin_auth');
        localStorage.removeItem('at_admin_auth');
        showToast('Đã đăng xuất khỏi trang quản trị!', 'fa-arrow-right-from-bracket');
      };

      // GitHub Commit Helper with Auto-Retry & Anti-Cache Conflict Resolution
      const commitFileToGitHub = async (token, repo, branch, path, contentStr, commitMsg, maxRetries = 3) => {
        const cleanToken = (token || '').trim();
        const b64 = btoa(unescape(encodeURIComponent(contentStr)));

        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          let sha = undefined;
          let remoteB64 = null;

          // Bước 1: Ưu tiên lấy SHA realtime trực tiếp từ Git Trees API của nhánh
          try {
            const treeRes = await fetch(`https://api.github.com/repos/${repo}/git/trees/${encodeURIComponent(branch)}?_t=${Date.now()}_${Math.floor(Math.random() * 100000)}`, {
              headers: {
                'Authorization': `token ${cleanToken}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            });

            if (treeRes.ok) {
              const treeData = await treeRes.json();
              const fileNode = (treeData.tree || []).find(f => f.path === path);
              if (fileNode) {
                sha = fileNode.sha;
              }
            }
          } catch (_) {}

          // Bước 2: Dự phòng Contents API nếu Git Trees không trả về
          if (!sha) {
            const getUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}&_t=${Date.now()}_${Math.floor(Math.random() * 100000)}`;
            const checkRes = await fetch(getUrl, {
              headers: {
                'Authorization': `token ${cleanToken}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            });

            if (checkRes.ok) {
              const checkData = await checkRes.json();
              sha = checkData.sha;
              remoteB64 = (checkData.content || '').replace(/\s/g, '');
            } else if (checkRes.status === 401) {
              throw new Error('GitHub Token không hợp lệ hoặc đã hết hạn (401 Bad Credentials)!');
            } else if (checkRes.status === 404) {
              sha = undefined;
            }
          }

          // Bước 3: Lấy nội dung remote từ Blob API để đối chiếu chính xác
          if (sha && !remoteB64) {
            try {
              const blobRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs/${sha}`, {
                headers: {
                  'Authorization': `token ${cleanToken}`,
                  'Accept': 'application/vnd.github.v3+json'
                }
              });
              if (blobRes.ok) {
                const blobData = await blobRes.json();
                remoteB64 = (blobData.content || '').replace(/\s/g, '');
              }
            } catch (_) {}
          }

          // Kiểm tra nếu nội dung trên GitHub đã trùng khớp 100%, bỏ qua commit để tránh xung đột
          if (sha && remoteB64 && remoteB64 === b64.replace(/\s/g, '')) {
            console.log(`[GitHub Sync] File ${path} không có thay đổi so với GitHub Cloud. Bỏ qua commit.`);
            return { updated: false, sha };
          }

          const putUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
          const bodyPayload = {
            message: commitMsg,
            content: b64,
            branch: branch
          };
          if (sha) bodyPayload.sha = sha;

          const res = await fetch(putUrl, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${cleanToken}`,
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(bodyPayload)
          });

          if (res.ok) {
            return { updated: true };
          }

          const errData = await res.json().catch(() => ({}));

          if (res.status === 401) {
            throw new Error('GitHub Token không có quyền ghi mã (Cần tạo Token có tích chọn quyền repo)');
          }

          // Xử lý xung đột 409 Conflict: Tự động chờ và lấy lại SHA mới nhất rồi thử lại
          if (res.status === 409 && attempt < maxRetries) {
            console.warn(`[GitHub Sync] 409 Conflict ở file ${path} (lần ${attempt}/${maxRetries}). Đang lấy SHA mới và đẩy lại...`);
            await new Promise(r => setTimeout(r, 1500 * attempt));
            continue;
          }

          if (res.status === 409) {
            throw new Error(`Xung đột GitHub (${path}): ${errData.message || '409 Conflict'}`);
          }

          throw new Error(errData.message || `Lỗi HTTP ${res.status}`);
        }
      };

      // Save & Sync All Changes directly to GitHub Cloud
      const handleSaveAndSyncGitHub = async () => {
        setSaving(true);
        const token = (config?.githubConfig?.defaultGhToken || localStorage.getItem('at_gh_token') || '').trim();
        const repo = (config?.githubConfig?.defaultGhRepo || 'cmstdev08/locket').trim();
        const branch = (config?.githubConfig?.defaultGhBranch || 'master').trim();

        // 1. Luôn lưu tạm vào LocalStorage trước để không bao giờ mất dữ liệu
        localStorage.setItem('at_site_config', JSON.stringify(config));
        if (token) localStorage.setItem('at_gh_token', token);
        if (config?.telegramConfig?.telegramBotToken) localStorage.setItem('at_tele_token', config.telegramConfig.telegramBotToken);
        if (config?.telegramConfig?.telegramChatId) localStorage.setItem('at_tele_chat_id', config.telegramConfig.telegramChatId);

        if (!token) {
          setSaving(false);
          setShowTokenModal(true);
          return;
        }

        try {
          showToast('⏳ Đang kết nối và đồng bộ lên GitHub Cloud...', 'fa-spinner fa-spin');

          // BẢO MẬT & TRÁNH BỊ CHẶN: Không bao giờ đẩy GitHub Token lên repository công khai
          const configToCommit = JSON.parse(JSON.stringify(config));
          if (configToCommit.githubConfig) {
            configToCommit.githubConfig.defaultGhToken = "";
          }

          // 2. Commit site-config.json
          const resConfig = await commitFileToGitHub(
            token, repo, branch,
            'site-config.json',
            JSON.stringify(configToCommit, null, 2),
            `⚙️ Admin Cập Nhật Cấu Hình Website: ${new Date().toLocaleString('vi-VN')}`
          );

          // Nếu site-config.json vừa commit mới, chờ 1.5 giây để GitHub branch ref cập nhật đồng bộ hoàn toàn
          if (resConfig && resConfig.updated) {
            await new Promise(r => setTimeout(r, 1500));
          }

          // 3. Commit access-keys.json
          await commitFileToGitHub(
            token, repo, branch,
            'access-keys.json',
            JSON.stringify(keysData, null, 2),
            `🔑 Admin Cập Nhật Danh Sách Access Keys: ${new Date().toLocaleString('vi-VN')}`
          );

          showToast('🎉 Tuyệt vời! Đã đồng bộ và lưu toàn bộ lên GitHub Cloud thành công!', 'fa-cloud-arrow-up');
        } catch (err) {
          console.error('Lỗi khi đẩy GitHub:', err);
          showToast(`Lỗi khi đẩy GitHub: ${err.message}. Đã lưu tạm trên máy.`, 'fa-triangle-exclamation');
        } finally {
          setSaving(false);
        }
      };

      // ========================================================
      // ORDERS MANAGEMENT HELPERS
      // ========================================================
      const filteredOrders = useMemo(() => {
        let list = config.orders || [];
        if (orderFilter !== 'all') {
          list = list.filter(o => o.status === orderFilter);
        }
        const q = orderSearch.trim().toLowerCase();
        if (q) {
          list = list.filter(o => 
            (o.id || '').toLowerCase().includes(q) ||
            (o.name || '').toLowerCase().includes(q) ||
            (o.contact || '').toLowerCase().includes(q) ||
            (o.transferMemo || '').toLowerCase().includes(q) ||
            (o.note || '').toLowerCase().includes(q)
          );
        }
        return list;
      }, [config.orders, orderFilter, orderSearch]);

      const handleUpdateOrderStatus = (orderId, newStatus) => {
        const updated = (config.orders || []).map(o => o.id === orderId ? { ...o, status: newStatus } : o);
        setConfig({ ...config, orders: updated });
        localStorage.setItem('at_customer_orders', JSON.stringify(updated));
        showToast(`Đã đổi trạng thái đơn #${orderId} thành "${newStatus === 'approved' ? 'Đã duyệt' : newStatus === 'rejected' ? 'Đã hủy' : 'Chờ xác nhận'}"!`);
      };

      const handleDeleteOrder = (orderId) => {
        if (!confirm(`Bạn có chắc muốn XÓA đơn hàng #${orderId}?`)) return;
        const updated = (config.orders || []).filter(o => o.id !== orderId);
        setConfig({ ...config, orders: updated });
        localStorage.setItem('at_customer_orders', JSON.stringify(updated));
        showToast(`Đã xóa đơn hàng #${orderId}!`);
      };

      const handleQuickCreateKeyForOrder = (order) => {
        let guessedUser = '';
        const match = (order.note || '').match(/@([a-zA-Z0-9_.-]+)/) || (order.name || '').match(/@([a-zA-Z0-9_.-]+)/);
        if (match) guessedUser = match[1];

        setEditingKey({
          key: generateRandomKey(),
          owner: `${order.name} (${order.contact || ''})`,
          boundUsername: guessedUser,
          maxUses: 9999,
          expiresAt: '2099-12-31',
          isMaster: false
        });
        setShowKeyModal(true);
      };

      const handleSaveManualOrder = (e) => {
        e.preventDefault();
        const f = e.target;
        const amt = parseInt(f.amount.value, 10) || 0;
        const newOrder = {
          id: 'AT_' + Math.floor(100000 + Math.random() * 900000),
          pkgName: f.pkgName.value,
          pkgId: 'manual',
          amount: amt,
          priceStr: amt.toLocaleString('vi-VN') + 'đ',
          name: f.custName.value.trim(),
          contact: f.custContact.value.trim(),
          social: f.custSocial.value.trim(),
          paymentMethod: f.payMethod.value,
          transferMemo: f.memo.value.trim() || 'AT Chuyen Khoan',
          note: f.custNote.value.trim(),
          billImg: null,
          time: new Date().toLocaleString('vi-VN'),
          createdAt: new Date().toISOString(),
          status: 'approved'
        };
        const updated = [newOrder, ...(config.orders || [])];
        setConfig({ ...config, orders: updated });
        localStorage.setItem('at_customer_orders', JSON.stringify(updated));
        setShowManualOrderModal(false);
        showToast('Đã thêm đơn hàng mới thành công!');
      };

      // ========================================================
      // TICKETS MANAGEMENT HELPERS
      // ========================================================
      const filteredTickets = useMemo(() => {
        let list = config.tickets || [];
        if (ticketFilter !== 'all') {
          list = list.filter(t => t.status === ticketFilter);
        }
        const q = ticketSearch.trim().toLowerCase();
        if (q) {
          list = list.filter(t => 
            (t.name || '').toLowerCase().includes(q) ||
            (t.contact || '').toLowerCase().includes(q) ||
            (t.subject || '').toLowerCase().includes(q) ||
            (t.message || '').toLowerCase().includes(q)
          );
        }
        return list;
      }, [config.tickets, ticketFilter, ticketSearch]);

      const handleUpdateTicketStatus = (ticketId, newStatus) => {
        const updated = (config.tickets || []).map(t => t.id === ticketId ? { ...t, status: newStatus } : t);
        setConfig({ ...config, tickets: updated });
        localStorage.setItem('at_customer_tickets', JSON.stringify(updated));
        showToast('Đã cập nhật trạng thái vé hỗ trợ!');
      };

      const handleDeleteTicket = (ticketId) => {
        if (!confirm(`Xóa vé hỗ trợ #${ticketId}?`)) return;
        const updated = (config.tickets || []).filter(t => t.id !== ticketId);
        setConfig({ ...config, tickets: updated });
        localStorage.setItem('at_customer_tickets', JSON.stringify(updated));
        showToast(`Đã xóa vé hỗ trợ #${ticketId}!`);
      };

      // ========================================================
      // DNS MANAGEMENT HELPERS
      // ========================================================
      const handleToggleDnsLock = () => {
        const curr = config.dnsConfig || DEFAULT_CONFIG.dnsConfig;
        const nextLocked = !curr.isLocked;
        const updated = { ...curr, isLocked: nextLocked };
        setConfig({ ...config, dnsConfig: updated });
        showToast(nextLocked ? '🔒 Đã BẬT khóa bảo trì DNS toàn hệ thống!' : '🔓 Đã MỞ khóa cho phép tải DNS bình thường!');
      };

      const handleToggleDnsRequireKey = () => {
        const curr = config.dnsConfig || DEFAULT_CONFIG.dnsConfig;
        const nextReq = !curr.requireKey;
        const updated = { ...curr, requireKey: nextReq };
        setConfig({ ...config, dnsConfig: updated });
        showToast(nextReq ? '🔑 Đã bật bắt buộc Key VIP mới được tải DNS!' : '🌐 Đã mở cho tải DNS miễn phí không cần Key!');
      };

      // ========================================================
      // ADMIN CREDENTIALS HELPER (CHANGE UNLIMITED TIMES)
      // ========================================================
      const handleSaveAdminCredentials = (e) => {
        e.preventDefault();
        const f = e.target;
        const newU = f.adminUser.value.trim();
        const newP = f.adminPass.value.trim();
        if (!newU || !newP) {
          alert('Tài khoản và mật khẩu không được để trống!');
          return;
        }
        const updatedCfg = {
          ...config,
          adminCredentials: { username: newU, password: newP }
        };
        setConfig(updatedCfg);
        localStorage.setItem('at_site_config', JSON.stringify(updatedCfg));
        showToast('🎉 Đã cập nhật tài khoản Admin! Hãy bấm "LƯU LÊN GITHUB" để lưu vĩnh viễn.', 'fa-shield-halved');
      };

      // Key Helpers
      const filteredKeys = useMemo(() => {
        const q = keySearch.trim().toLowerCase();
        if (!q) return keysData.keys || [];
        return (keysData.keys || []).filter(k => 
          (k.key || '').toLowerCase().includes(q) ||
          (k.owner || '').toLowerCase().includes(q) ||
          (k.boundUsername || '').toLowerCase().includes(q)
        );
      }, [keysData.keys, keySearch]);

      const generateRandomKey = () => {
        const phone = '09' + Math.floor(10000000 + Math.random() * 90000000);
        return `Locket60s-${phone}`;
      };

      const handleSaveKey = (e) => {
        e.preventDefault();
        const form = e.target;
        const keyVal = form.keyVal.value.trim();
        const ownerVal = form.ownerVal.value.trim() || 'Khách hàng';
        const boundUserVal = form.boundUserVal.value.trim().replace(/^@/, '').toLowerCase();
        const maxUsesVal = parseInt(form.maxUsesVal.value, 10) || 100;
        const expiresVal = form.expiresVal.value || '2099-12-31';
        const isMasterVal = form.isMasterVal.checked;

        if (!keyVal) {
          alert('Vui lòng nhập mã Key!');
          return;
        }

        const newKeyObj = {
          key: keyVal,
          owner: ownerVal,
          boundUsername: boundUserVal || undefined,
          allowedFeatures: ["all"],
          isMaster: isMasterVal ? true : undefined,
          maxUses: maxUsesVal,
          usedCount: editingKey ? (editingKey.usedCount || 0) : 0,
          expiresAt: expiresVal
        };

        const existingIdx = (keysData.keys || []).findIndex(k => k.key.toUpperCase() === keyVal.toUpperCase());
        let updatedList = [...(keysData.keys || [])];

        if (existingIdx !== -1) {
          updatedList[existingIdx] = { ...updatedList[existingIdx], ...newKeyObj };
        } else {
          updatedList.unshift(newKeyObj);
        }

        setKeysData({ ...keysData, keys: updatedList });
        setShowKeyModal(false);
        setEditingKey(null);
        showToast(`Đã lưu Key ${keyVal}! Hãy bấm nút "LƯU LÊN GITHUB" ở góc trên.`);
      };

      const handleDeleteKey = (targetKey) => {
        if (!confirm(`Bạn có chắc chắn muốn XÓA vĩnh viễn Key "${targetKey}" không?`)) return;
        const updatedList = (keysData.keys || []).filter(k => k.key !== targetKey);
        setKeysData({ ...keysData, keys: updatedList });
        showToast(`Đã xóa Key ${targetKey}! Hãy bấm "LƯU LÊN GITHUB" để hoàn tất.`);
      };

      // Package Toggle Maintenance
      const handleTogglePackageMaintenance = (pkgId) => {
        const updatedPkgs = (config.packages || []).map(p => {
          if (p.id === pkgId) {
            const nextM = !p.isMaintenance;
            return {
              ...p,
              isMaintenance: nextM,
              tag: nextM ? 'BẢO TRÌ VÔ THỜI HẠN 🔒' : (p.id === 'locket-60s' ? 'ĐANG MỞ BÁN • VĨNH VIỄN TRỌN ĐỜI 🔥' : 'ĐANG MỞ BÁN 🔥')
            };
          }
          return p;
        });
        setConfig({ ...config, packages: updatedPkgs });
        showToast('Đã đổi trạng thái gói! Bấm "LƯU LÊN GITHUB" để cập nhật web khách.');
      };

      // Package Update Price
      const handleUpdatePackagePrice = (pkgId, newPriceNum, newPriceStr, newOriginalStr) => {
        const updatedPkgs = (config.packages || []).map(p => {
          if (p.id === pkgId) {
            return {
              ...p,
              priceNum: newPriceNum,
              price: newPriceStr,
              originalPrice: newOriginalStr
            };
          }
          return p;
        });
        setConfig({ ...config, packages: updatedPkgs });
        showToast('Đã cập nhật giá bán mới!');
      };

      // Voucher Helpers
      const handleSaveVoucher = (e) => {
        e.preventDefault();
        const code = e.target.vCode.value.trim().toUpperCase();
        const discount = parseInt(e.target.vDiscount.value, 10) || 0;
        const desc = e.target.vDesc.value.trim() || 'Mã ưu đãi giảm giá';
        if (!code) return;

        const newVoucher = { code, discount, desc };
        const list = [...(config.vouchers || [])];
        const idx = list.findIndex(v => v.code === code);
        if (idx !== -1) list[idx] = newVoucher;
        else list.push(newVoucher);

        setConfig({ ...config, vouchers: list });
        setShowVoucherModal(false);
        setEditingVoucher(null);
        showToast(`Đã lưu Voucher ${code}! Bấm "LƯU LÊN GITHUB" để áp dụng.`);
      };

      const handleDeleteVoucher = (code) => {
        if (!confirm(`Xóa mã voucher "${code}"?`)) return;
        const list = (config.vouchers || []).filter(v => v.code !== code);
        setConfig({ ...config, vouchers: list });
        showToast(`Đã xóa voucher ${code}!`);

      // Test Telegram message
      const handleTestTelegram = async () => {
        const botToken = (config.telegramConfig.telegramBotToken || '').trim();
        const chatId = (config.telegramConfig.telegramChatId || '').trim();
        if (!botToken || !chatId) {
          alert('Vui lòng nhập đủ Bot Token và Chat ID trước khi test!');
          return;
        }
        try {
          const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: chatId,
              text: `👑 <b>ANH TUẤN iOS - TEST BOT THÀNH CÔNG!</b>\n━━━━━━━━━━━━━━━━━━━━\n✅ Kết nối thành công từ Bảng Quản Trị Admin.\n⏰ Thời gian: ${new Date().toLocaleString('vi-VN')}`,
              parse_mode: 'HTML'
            })
          });
          const data = await res.json();
          if (data.ok) {
            showToast('✅ Đã gửi tin nhắn test thành công về Telegram của bạn!');
          } else {
            alert('Lỗi Telegram: ' + (data.description || 'Không gửi được'));
          }
        } catch (e) {
          alert('Lỗi kết nối API Telegram: ' + e.message);

      };

      // ========================================================

                  <i className="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập Quản Trị

                <i className="fa-solid fa-shield-halved"></i>
              </div>
              <div>
                <h1 className="font-black text-sm text-white flex items-center gap-1.5">
                  ANH TUẤN iOS <span className="bg-emerald-500/20 text-emerald-400 text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border border-emerald-500/30">ADMIN V2.5</span>
                </h1>
                <p className="text-[10px] text-slate-400 hidden sm:block">Quản trị Bill, Ticket Hỗ Trợ, DNS, Access Keys & Đồng Bộ Cloud</p>

              <a

                <i className="fa-solid fa-arrow-up-right-from-square text-[10px] text-emerald-400"></i>

                    <button
                      type="submit"
                      className="flex-[2] py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-extrabold text-xs uppercase shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-solid fa-cloud-arrow-up"></i> Lưu Token & Đẩy Ngay
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast.show && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900/95 border border-emerald-500/50 text-white text-xs font-bold shadow-2xl flex items-center gap-2.5 animate-bounce">
              <i className={`fa-solid ${toast.icon} text-emerald-400 text-base`}></i>
              <span>{toast.text}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
